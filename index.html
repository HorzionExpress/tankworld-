/* ============================================================
   24. 玩家控制
   ============================================================ */
function updatePlayer(dt) {
  const v = playerVehicle;
  if (!v || !v.alive) return;

  /* ---------- 飞机 ---------- */
  if (v.kind === 'air') {
    let throttle = 0.6;
    if (keys['KeyW']) throttle = 1.0;
    if (keys['KeyS']) throttle = 0.15;
    if (keys['ShiftLeft'] || keys['ShiftRight']) throttle = Math.min(1.35, throttle + 0.45);
    v.throttle = throttle;

    v.desiredYaw = aimYaw;
    v.desiredPitch = clamp(aimPitch, -0.55, 0.5);

    if (keys['KeyA']) v.desiredYaw += 0.35;
    if (keys['KeyD']) v.desiredYaw -= 0.35;
    return;
  }

  /* ---------- 坦克 ---------- */
  let fwd = 0, turn = 0;
  if (keys['KeyW']) fwd += 1;
  if (keys['KeyS']) fwd -= 1;
  if (keys['KeyA']) turn += 1;
  if (keys['KeyD']) turn -= 1;

  const spd = (keys['ShiftLeft'] || keys['ShiftRight']) ? 1.45 : 1.0;
  v.forwardInput = fwd * spd;
  v.turnInput = turn;

  /* ----- 期望方向（相对车体） ----- */
  let wantWorldYaw = v.yaw + aimYaw;
  let wantPitch    = aimPitch;

  /* ----- 辅助瞄准 ----- */
  assistLocked = false;
  const assist = findAimAssist(v, wantWorldYaw, wantPitch);

  if (assist) {
    assistLocked = true;

    const kYaw   = 1 - assist.dYaw   / ASSIST_YAW_CONE;
    const kPitch = 1 - assist.dPitch / ASSIST_PITCH_CONE;
    const k = Math.max(0, Math.min(kYaw, kPitch));

    const pull = 0.30 * cheats.assistStr * k * k;

    wantWorldYaw += normAngle(assist.solution.yaw - wantWorldYaw) * pull;
    wantPitch    += (assist.solution.pitch - wantPitch) * pull;

    aimYaw   = clamp(normAngle(wantWorldYaw - v.yaw), -YAW_LIMIT, YAW_LIMIT);
    aimPitch = clamp(wantPitch, -8*DEG, 22*DEG);
  }

  v.desiredTurretWorldYaw = v.yaw + aimYaw;
  v.desiredGunPitch = clamp(aimPitch, -8*DEG, 22*DEG);

  /* ----- 炮塔是否就绪 ----- */
  const errYaw = Math.abs(normAngle(v.desiredTurretWorldYaw - (v.yaw + v.turretYaw)));
  const errPitch = Math.abs(v.desiredGunPitch - v.gunPitch);
  aimReady = errYaw < 0.7*DEG && errPitch < 0.7*DEG;

  /* ----- ★ 计算准星世界坐标点（用于弹道修正） ----- */
  playerAimPoint.copy(computeCrosshairPoint());
}

  ch.classList.toggle('locked', assistLocked);
  ch.classList.toggle('ready', aimReady && !assistLocked);
}

/* ============================================================
   26. 相机
   ============================================================ */
const camPos = new THREE.Vector3(0, 12, -30);
const camLook = new THREE.Vector3();
let camYawCache = 0, camPitchCache = 0;

function updateCamera(dt) {
  const v = playerVehicle;

  /* ---------- 飞机 ---------- */
  if (v && v.alive && v.kind === 'air') {
    const cp = Math.cos(v.pitch);
    const forward = new THREE.Vector3(
      Math.sin(v.yaw)*cp, Math.sin(v.pitch), Math.cos(v.yaw)*cp
    );

    cameraRecoil *= Math.pow(0.0015, dt);
    if (cameraRecoil < 0.001) cameraRecoil = 0;

    const desired = v.pos.clone()
      .addScaledVector(forward, -15 - v.speed * 0.09)
      .add(new THREE.Vector3(0, 4.5, 0));

    const camGround = terrainHeight(desired.x, desired.z);
    if (desired.y < camGround + 3) desired.y = camGround + 3;

    camPos.lerp(desired, 1 - Math.exp(-11*dt));

    const cg = terrainHeight(camPos.x, camPos.z);
    if (camPos.y < cg + 2.5) camPos.y = cg + 2.5;

    camera.position.copy(camPos);

    const e = new THREE.Euler(-v.pitch, v.yaw, v.roll, 'YXZ');
    camera.up.set(0,1,0).applyEuler(e).normalize();

    camLook.copy(v.pos).addScaledVector(forward, 60);
    camera.lookAt(camLook);

    camera.fov = lerp(camera.fov, 68, 1 - Math.exp(-8*dt));
    camera.updateProjectionMatrix();

    sun.position.set(v.pos.x + 180, 260, v.pos.z + 140);
    sun.target.position.set(v.pos.x, 0, v.pos.z);
    sun.target.updateMatrixWorld();
    return;
  }

  /* ---------- 坦克 ---------- */
  let camYaw = 0, camPitch = 0, basePos = new THREE.Vector3(), baseY = 3;
  camera.up.set(0,1,0);

  if (v && v.alive) {
    camYaw = v.yaw + aimYaw;
    camPitch = aimPitch;
    basePos = v.pos;
    baseY = v.pos.y + 2.6;
  } else if (v) {
    camYaw = camYawCache;
    camPitch = camPitchCache;
    basePos = v.pos;
    baseY = v.pos.y + 2.2;
  }
  camYawCache = camYaw; camPitchCache = camPitch;

  const cp = Math.cos(camPitch), sp = Math.sin(camPitch);
  const wantFwd = new THREE.Vector3(
    Math.sin(camYaw)*cp, sp, Math.cos(camYaw)*cp
  ).normalize();

  cameraRecoil *= Math.pow(0.0004, dt);
  if (cameraRecoil < 0.001) cameraRecoil = 0;

  /* ---- 炮镜 ---- */
  if (aiming && v && v.alive) {
    v.root.updateMatrixWorld(true);
    const center = new THREE.Vector3();
    v.turretMesh.getWorldPosition(center);
    center.y += 0.35;

    const desired = center.clone().addScaledVector(wantFwd, -0.3);
    camPos.lerp(desired, 1 - Math.exp(-30*dt));
    camera.position.copy(camPos);

    camLook.copy(camPos).addScaledVector(wantFwd, 300);
    camera.lookAt(camLook);

    camera.fov = lerp(camera.fov, 9, 1 - Math.exp(-22*dt));
    camera.updateProjectionMatrix();

    scopeDistance = measureDistance(camPos, wantFwd);
    return;
  }

  /* ---- 第三人称 ---- */
  const anchor = new THREE.Vector3(basePos.x, baseY, basePos.z);
  const desired = anchor.clone()
    .add(new THREE.Vector3(0, 2.0, 0))
    .addScaledVector(wantFwd, -13.5)
    .addScaledVector(new THREE.Vector3(wantFwd.z, 0, -wantFwd.x), 0.9)
    .addScaledVector(wantFwd, -cameraRecoil*1.8);

  const camGround = terrainHeight(desired.x, desired.z);
  if (desired.y < camGround + 2.2) desired.y = camGround + 2.2;

  camPos.lerp(desired, 1 - Math.exp(-14*dt));

  const cg = terrainHeight(camPos.x, camPos.z);
  if (camPos.y < cg + 1.8) camPos.y = cg + 1.8;

  camera.position.copy(camPos);
  camLook.copy(camPos).addScaledVector(wantFwd, 70);
  camera.lookAt(camLook);

  camera.fov = lerp(camera.fov, 62, 1 - Math.exp(-18*dt));
  camera.updateProjectionMatrix();

  sun.position.set(basePos.x + 180, 260, basePos.z + 140);
  sun.target.position.set(basePos.x, 0, basePos.z);
  sun.target.updateMatrixWorld();
}

const _mRay = new THREE.Raycaster();
function measureDistance(origin, dir) {
  let best = Infinity;
  _mRay.set(origin, dir);
  _mRay.near = 0; _mRay.far = 2500;
  const hits = _mRay.intersectObjects(world.hitMeshes, false);
  if (hits.length) best = hits[0].distance;

  let t = 0, step = 6;
  while (t < Math.min(best, 2200)) {
    t += step;
    const p = origin.clone().addScaledVector(dir, t);
    if (p.y < terrainHeight(p.x, p.z)) { best = Math.min(best, t); break; }
    if (t > 400) step = 14;
  }
  return best;
}

/* ============================================================
   27. 小地图
   ============================================================ */
const mmCanvas = document.getElementById('minimap');
const mmCtx = mmCanvas.getContext('2d');
const MM_SIZE = 200;
const MM_WORLD = BOUND * 2;
const MM_SCALE = MM_SIZE / MM_WORLD;
const MM_BG_RES = 128;

const mmBackground = document.createElement('canvas');
mmBackground.width = MM_BG_RES;
mmBackground.height = MM_BG_RES;
(function renderMinimapBackground() {
  const ctx = mmBackground.getContext('2d');
  const img = ctx.createImageData(MM_BG_RES, MM_BG_RES);
  const data = img.data;

  for (let j = 0; j < MM_BG_RES; j++) {
    for (let i = 0; i < MM_BG_RES; i++) {
      const wx = (i / MM_BG_RES) * MM_WORLD - BOUND;
      const wz = (j / MM_BG_RES) * MM_WORLD - BOUND;
      const h = terrainHeight(wx, wz);

      let r, g, b;
      const t = clamp((h + 10) / 120, 0, 1);
      if (t < 0.34)      { r = 52;  g = 74;  b = 44; }
      else if (t < 0.60) { r = 74;  g = 96;  b = 52; }
      else if (t < 0.82) { r = 104; g = 100; b = 78; }
      else               { r = 196; g = 208; b = 214; }

      // 明暗细节
      const n = (Math.sin(wx*0.08) * Math.cos(wz*0.08)) * 8;
      const idx = (j * MM_BG_RES + i) * 4;
      data[idx]     = clamp(r + n, 0, 255);
      data[idx + 1] = clamp(g + n, 0, 255);
      data[idx + 2] = clamp(b + n, 0, 255);
      data[idx + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
})();

const mmToX = x => (x + BOUND) * MM_SCALE;
const mmToY = z => (z + BOUND) * MM_SCALE;

function drawMinimap() {
  if (!mmCtx) return;
  const S = MM_SIZE;

  mmCtx.clearRect(0, 0, S, S);

  // 背景地形
  mmCtx.globalAlpha = 0.85;
  mmCtx.drawImage(mmBackground, 0, 0, S, S);
  mmCtx.globalAlpha = 1;

  // 边框圈
  mmCtx.strokeStyle = 'rgba(140,220,120,.35)';
  mmCtx.lineWidth = 1;
  mmCtx.beginPath();
  mmCtx.arc(S/2, S/2, S/2 - 2, 0, Math.PI*2);
  mmCtx.stroke();

  // 障碍物点
  mmCtx.fillStyle = 'rgba(40,40,32,.55)';
  for (const ob of obstacles) {
    const x = mmToX(ob.x), y = mmToY(ob.z);
    const r = Math.max(1.0, ob.r * MM_SCALE * 0.9);
    mmCtx.beginPath();
    mmCtx.arc(x, y, r, 0, Math.PI*2);
    mmCtx.fill();
  }

  // 基地
  mmCtx.strokeStyle = 'rgba(90,150,255,.8)';
  mmCtx.lineWidth = 1.6;
  mmCtx.beginPath();
  mmCtx.arc(mmToX(PLAYER_BASE_POS.x), mmToY(PLAYER_BASE_POS.z), BASE_RADIUS*MM_SCALE, 0, Math.PI*2);
  mmCtx.stroke();

  mmCtx.strokeStyle = 'rgba(255,90,90,.8)';
  mmCtx.beginPath();
  mmCtx.arc(mmToX(ENEMY_BASE_POS.x), mmToY(ENEMY_BASE_POS.z), BASE_RADIUS*MM_SCALE, 0, Math.PI*2);
  mmCtx.stroke();

  // 载具
  for (const v of world.vehicles) {
    if (!v.alive) continue;

    const x = mmToX(v.pos.x);
    const y = mmToY(v.pos.z);

    if (v === playerVehicle) continue;

    const isAir = v.kind === 'air';
    const friendly = v.team === 0;

    let color;
    if (friendly) color = 'rgba(110,220,255,.95)';
    else          color = 'rgba(255,110,100,.95)';

    mmCtx.fillStyle = color;

    if (isAir) {
      // 飞机画成小菱形
      mmCtx.beginPath();
      mmCtx.moveTo(x, y - 3.5);
      mmCtx.lineTo(x + 3.5, y);
      mmCtx.lineTo(x, y + 3.5);
      mmCtx.lineTo(x - 3.5, y);
      mmCtx.closePath();
      mmCtx.fill();
    } else {
      // 坦克画成朝向三角
      const ang = -v.yaw;
      mmCtx.save();
      mmCtx.translate(x, y);
      mmCtx.rotate(ang);
      mmCtx.beginPath();
      mmCtx.moveTo(0, -4.2);
      mmCtx.lineTo(3.0, 3.4);
      mmCtx.lineTo(0, 1.8);
      mmCtx.lineTo(-3.0, 3.4);
      mmCtx.closePath();
      mmCtx.fill();
      mmCtx.restore();
    }

    // 血条
    const hpPct = clamp(v.hp / v.maxHp, 0, 1);
    if (hpPct < 1) {
      mmCtx.fillStyle = 'rgba(0,0,0,.6)';
      mmCtx.fillRect(x - 5, y - 8, 10, 2.2);
      mmCtx.fillStyle = hpPct > 0.5 ? '#7ee07a' : (hpPct > 0.25 ? '#e0c050' : '#e06060');
      mmCtx.fillRect(x - 5, y - 8, 10 * hpPct, 2.2);
    }
  }

  // 玩家（最后绘制，最上层）
  const pv = playerVehicle;
  if (pv && pv.alive) {
    const x = mmToX(pv.pos.x);
    const y = mmToY(pv.pos.z);

    // 视野扇形
    const faceAng = -(pv.kind === 'air' ? pv.yaw : (pv.yaw + aimYaw));
    mmCtx.save();
    mmCtx.translate(x, y);
    mmCtx.rotate(faceAng);
    const grad = mmCtx.createRadialGradient(0, 0, 2, 0, 0, 26);
    grad.addColorStop(0, 'rgba(150,255,150,.30)');
    grad.addColorStop(1, 'rgba(150,255,150,0)');
    mmCtx.fillStyle = grad;
    mmCtx.beginPath();
    mmCtx.moveTo(0, 0);
    mmCtx.arc(0, 0, 26, -Math.PI/2 - 0.5, -Math.PI/2 + 0.5);
    mmCtx.closePath();
    mmCtx.fill();
    mmCtx.restore();

    // 箭头
    mmCtx.save();
    mmCtx.translate(x, y);
    mmCtx.rotate(faceAng);
    mmCtx.fillStyle = '#a8ff80';
    mmCtx.strokeStyle = 'rgba(0,0,0,.8)';
    mmCtx.lineWidth = 1;
    mmCtx.beginPath();
    mmCtx.moveTo(0, -6);
    mmCtx.lineTo(4.2, 4.6);
    mmCtx.lineTo(0, 2.4);
    mmCtx.lineTo(-4.2, 4.6);
    mmCtx.closePath();
    mmCtx.fill();
    mmCtx.stroke();
    mmCtx.restore();
  }

  // 坐标刻度
  mmCtx.strokeStyle = 'rgba(180,240,160,.30)';
  mmCtx.lineWidth = 1;
  mmCtx.beginPath();
  mmCtx.moveTo(S/2, 4); mmCtx.lineTo(S/2, 10);
  mmCtx.moveTo(S/2, S-4); mmCtx.lineTo(S/2, S-10);
  mmCtx.moveTo(4, S/2); mmCtx.lineTo(10, S/2);
  mmCtx.moveTo(S-4, S/2); mmCtx.lineTo(S-10, S/2);
  mmCtx.stroke();

  // 北向标记
  mmCtx.fillStyle = 'rgba(190,240,180,.75)';
  mmCtx.font = 'bold 10px Consolas, monospace';
  mmCtx.textAlign = 'center';
  mmCtx.fillText('N', S/2, 18);
}

/* ============================================================
   28. HUD
   ============================================================ */
const hudEls = {
  hpFill: document.getElementById('hp-fill'),
  reloadFill: document.getElementById('reload-fill'),
  tankName: document.getElementById('tank-name'),
  shellName: document.getElementById('shell-name'),
  shellCount: document.getElementById('shell-count'),
  shellList: document.getElementById('shell-list'),
  mods: document.getElementById('mods'),
  scopeRange: document.getElementById('scope-range'),
  debugPanel: document.getElementById('debugPanel'),
  hpLabel: document.getElementById('hp-label'),
};

function updateHUD(force = false) {
  const v = playerVehicle;
  if (!v) return;

  const hpPct = clamp(v.hp / v.maxHp, 0, 1);
  hudEls.hpFill.style.width = (hpPct*100).toFixed(1) + '%';
  hudEls.hpFill.style.background = hpPct > 0.6
    ? 'linear-gradient(90deg,#59d05a,#a8e05a)'
    : hpPct > 0.3
      ? 'linear-gradient(90deg,#d0a040,#e0d060)'
      : 'linear-gradient(90deg,#c04040,#e06060)';

  hudEls.tankName.textContent = v.bp.name;

  if (v.kind === 'air') {
    hudEls.hpLabel.textContent = '机体完整度';
    hudEls.shellName.textContent = '机炮 · 12.7mm';
    hudEls.shellCount.textContent = `炸弹 ${v.bombCount}`;

    const firePct = 1 - clamp(v.gunTimer / Math.max(v.bp.fireRate, 0.001), 0, 1);
    hudEls.reloadFill.style.width = (firePct*100).toFixed(1) + '%';
    hudEls.reloadFill.style.background = 'linear-gradient(90deg,#e07040,#f0a060)';

    if (force) {
      hudEls.shellList.innerHTML = '';
      const b1 = document.createElement('span');
      b1.className = 'shell-badge active';
      b1.textContent = '左键 机炮';
      const b2 = document.createElement('span');
      b2.className = 'shell-badge';
      b2.style.opacity = v.bombCount > 0 ? '1' : '0.35';
      b2.textContent = '右键 投弹';
      hudEls.shellList.appendChild(b1);
      hudEls.shellList.appendChild(b2);
    }

    const alt = Math.round(v.pos.y - terrainHeight(v.pos.x, v.pos.z));
    const spd = Math.round(v.speed * 3.6);
    hudEls.mods.innerHTML =
      `<span class="mod-ok">速度 ${spd} km/h</span> &nbsp;·&nbsp; ` +
      `<span class="${alt > 25 ? 'mod-ok' : 'mod-bad'}">离地 ${alt} m</span>` +
      (v.bombCount > 0 ? ` &nbsp;·&nbsp; <span class="mod-ok">炸弹 ${v.bombCount}</span>` : '');
    return;
  }

  // ---- 坦克 ----
  hudEls.hpLabel.textContent = '车体完整度';
  hudEls.reloadFill.style.background = 'linear-gradient(90deg,#e0b040,#f0e070)';

  const totalReload = v.bp.reload * 1.85;
  const rlPct = v.reloadTime > 0 ? clamp(1 - v.reloadTime/totalReload, 0, 1) : 1;
  hudEls.reloadFill.style.width = (rlPct*100).toFixed(1) + '%';

  const sd = SHELLS[v.currentShell];
  hudEls.shellName.textContent = sd.name;
  hudEls.shellCount.textContent = cheats.ammo ? '∞' : `${v.ammo[v.currentShell] || 0} 发`;

  if (force) {
    hudEls.shellList.innerHTML = '';
    v.bp.shells.forEach((id, i) => {
      const s = SHELLS[id];
      const b = document.createElement('span');
      b.className = 'shell-badge' + (id === v.currentShell ? ' active' : '');
      b.textContent = `${i+1} ${s.short}`;
      b.title = `穿深 ${s.pen}mm · 伤害 ${s.dmg}`;
      hudEls.shellList.appendChild(b);
    });
  } else {
    [...hudEls.shellList.children].forEach((el, i) => {
      el.classList.toggle('active', v.bp.shells[i] === v.currentShell);
    });
  }

  const m = v.modules;
  const aimTxt = assistLocked
    ? '<span style="color:#8ce6ff">辅助瞄准 已锁定</span>'
    : (aimReady ? '<span class="mod-ok">炮塔就绪</span>'
                : '<span class="mod-bad">炮塔转动中</span>');

  hudEls.mods.innerHTML = [
    `<span class="${m.engine?'mod-ok':'mod-bad'}">发动机 ${m.engine?'正常':'损毁'}</span>`,
    `<span class="${m.gun?'mod-ok':'mod-bad'}">火炮 ${m.gun?'正常':'损毁'}</span>`,
    `<span class="${m.turretRing?'mod-ok':'mod-bad'}">炮塔环 ${m.turretRing?'正常':'卡死'}</span>`,
    `<span class="${v.crew >= v.bp.crew?'mod-ok':'mod-bad'}">车组 ${v.crew}/${v.bp.crew}</span>`,
    aimTxt
  ].join(' &nbsp;·&nbsp; ');

  if (aiming) {
    hudEls.scopeRange.textContent = scopeDistance < 2400
      ? `${Math.round(scopeDistance)} m` : '--- m';
  }
}

function toggleCheatMenu() {
  document.getElementById('cheatMenu').classList.toggle('hidden');
}

(function setupCheats() {
  const bind = (id, key) => {
    const el = document.getElementById(id);
    el.addEventListener('change', () => { cheats[key] = el.checked; });
  };
  bind('cGod', 'god');
  bind('cAmmo', 'ammo');
  bind('cReload', 'reload');
  bind('cOneShot', 'oneShot');
  bind('cDebug', 'debug');
  bind('cSpeedUnlock', 'noTerrainDrag');
  bind('cAssist', 'assist');

  const as = document.getElementById('cAssistStr');
  const asv = document.getElementById('cAssistVal');
  as.addEventListener('input', () => {
    cheats.assistStr = parseFloat(as.value);
    asv.textContent = cheats.assistStr.toFixed(1);
  });

  const sp = document.getElementById('cSpeed');
  const spv = document.getElementById('cSpeedVal');
  sp.addEventListener('input', () => {
    cheats.speedMul = parseFloat(sp.value);
    spv.textContent = cheats.speedMul.toFixed(1) + 'x';
  });

  const vol = document.getElementById('cVolume');
  const volv = document.getElementById('cVolumeVal');
  vol.addEventListener('input', () => {
    Audio2.setVolume(parseFloat(vol.value));
    volv.textContent = parseFloat(vol.value).toFixed(1);
  });

  const dbg = document.getElementById('cDebug');
  dbg.addEventListener('change', () => {
    hudEls.debugPanel.classList.toggle('hidden', !dbg.checked);
  });

  document.getElementById('cHeal').addEventListener('click', () => {
    if (!playerVehicle) return;
    playerVehicle.hp = playerVehicle.maxHp;
    if (playerVehicle.kind === 'tank') {
      playerVehicle.crew = playerVehicle.bp.crew;
      playerVehicle.modules = { engine:true, turretRing:true, gun:true, driver:true };
    }
    log('载具已完全修复', 'good');
  });

  document.getElementById('cTeleport').addEventListener('click', () => {
    if (!playerVehicle) return;
    let best = null, bd = Infinity;
    for (const v of world.vehicles) {
      if (!v.alive || v.team === 0) continue;
      const d = playerVehicle.pos.distanceTo(v.pos);
      if (d < bd) { bd = d; best = v; }
    }
    if (!best) { log('没有存活的敌军', 'warn'); return; }

    const ang = Math.random()*Math.PI*2;
    if (playerVehicle.kind === 'air') {
      const x = best.pos.x + Math.sin(ang)*90;
      const z = best.pos.z + Math.cos(ang)*90;
      playerVehicle.pos.set(x, terrainHeight(x, z) + 180, z);
      playerVehicle.yaw = Math.atan2(best.pos.x - x, best.pos.z - z);
      playerVehicle.desiredYaw = playerVehicle.yaw;
      aimYaw = playerVehicle.yaw;
      aimPitch = -0.3;
    } else {
      const x = best.pos.x + Math.sin(ang)*55;
      const z = best.pos.z + Math.cos(ang)*55;
      playerVehicle.pos.set(x, terrainHeight(x, z), z);
      playerVehicle.yVel = 0;
      playerVehicle.yaw = Math.atan2(best.pos.x - x, best.pos.z - z);
      playerVehicle.desiredTurretWorldYaw = playerVehicle.yaw;
      playerVehicle.visualYaw = playerVehicle.yaw;
      aimYaw = 0;
      aimPitch = 0;
    }
    log('已传送到最近敌军附近', 'info');
  });

  document.getElementById('cSpawn').addEventListener('click', () => {
    const pool = Object.keys(TANK_BLUEPRINTS);
    for (let i = 0; i < 3; i++) {
      const id = pool[Math.floor(Math.random()*pool.length)];
      const ang = Math.random()*Math.PI*2;
      const baseX = playerVehicle?.pos.x || 0;
      const baseZ = playerVehicle?.pos.z || 0;
      const x = clamp(baseX + Math.sin(ang)*220, -BOUND+50, BOUND-50);
      const z = clamp(baseZ + Math.cos(ang)*220, -BOUND+50, BOUND-50);
      const t = createTank(id, 1, x, z, Math.PI);
      aiControllers.push({ ctrl: new AIController(t, rand(0.75, 1.2)) });
    }
    log('已生成 3 辆敌军', 'warn');
    checkBattleEnd();
  });

  document.getElementById('cKillAll').addEventListener('click', () => {
    for (const v of world.vehicles) {
      if (v.alive && v.team === 1) v.destroy(playerVehicle);
    }
    log('已全灭敌军', 'good');
  });

  document.getElementById('cAmmoMax').addEventListener('click', () => {
    if (!playerVehicle) return;
    if (playerVehicle.kind === 'tank') {
      for (const s of playerVehicle.bp.shells) playerVehicle.ammo[s] = 40;
      log('弹药已补满', 'good');
    } else {
      playerVehicle.bombCount = playerVehicle.bp.bombs;
      log('炸弹已补满', 'good');
    }
  });
})();

/* ============================================================
   30. 主循环
   ============================================================ */
const clock = new THREE.Clock();
let hudTimer = 0;
let mmTimer = 0;
let audioTimer = 0;

function updateAudio(dt) {
  if (!Audio2.ready) return;

  audioTimer -= dt;
  if (audioTimer > 0) return;
  audioTimer = 0.05;

  const camDir = _tmpV1;
  camera.getWorldDirection(camDir);
  const right = _tmpV3.set(camDir.z, 0, -camDir.x).normalize();

  for (const v of world.vehicles) {
    if (!v.engineVoice) continue;

    if (!v.alive) {
      v.engineVoice.setVolume(0);
      continue;
    }

    const d = camera.position.distanceTo(v.pos);
    let vol = clamp(1 - d / 260, 0, 1);
    vol = vol * vol * 0.16;
    if (v.isPlayer) vol *= 1.6;

    v.engineVoice.setVolume(vol);

    if (vol > 0.0008) {
      const rpm = clamp(Math.abs(v.speed) / Math.max(v.bp.maxSpeed, 1), 0, 1);
      v.engineVoice.setRpm(rpm * 0.85 + (v.forwardInput !== 0 ? 0.15 : 0), Math.abs(v.speed) > 1);

      const toObj = _tmpV2.subVectors(v.pos, camera.position).normalize();
      v.engineVoice.setPan(clamp(toObj.dot(right), -1, 1) * 0.8);
    }
  }
}

function animate() {
  requestAnimationFrame(animate);

  const dt = Math.min(clock.getDelta(), 0.05);
  world.time += dt;

  if (!gameOver) {
    updatePlayer(dt);

    for (const entry of aiControllers) {
      const ctrl = entry.ctrl;
      if (!ctrl) continue;
      if (!ctrl.tank.alive) continue;
      ctrl.update(dt);
    }

    for (const v of world.vehicles) {
      if (v.alive) v.update(dt);
    }

    for (let i = world.projectiles.length - 1; i >= 0; i--) {
      const p = world.projectiles[i];
      p.update(dt);
      if (!p.alive) world.projectiles.splice(i, 1);
    }

    for (let i = world.bombs.length - 1; i >= 0; i--) {
      const b = world.bombs[i];
      b.update(dt);
      if (!b.alive) world.bombs.splice(i, 1);
    }
  }

  updateEffects(dt);
  updateCamera(dt);
  updateCrosshair();
  updateAudio(dt);

  hudTimer -= dt;
  if (hudTimer <= 0) {
    hudTimer = 0.08;
    updateHUD(false);
    checkBattleEnd();

    if (cheats.debug && playerVehicle) {
      const v = playerVehicle;
      let txt = `FPS      ${(1/Math.max(dt,0.0001)).toFixed(0)}\n`;
      txt += `坐标     ${v.pos.x.toFixed(1)}, ${v.pos.y.toFixed(1)}, ${v.pos.z.toFixed(1)}\n`;
      txt += `速度     ${(v.speed*3.6).toFixed(1)} km/h\n`;
      if (v.kind === 'tank') {
        txt += `车体偏航 ${(v.yaw/DEG).toFixed(1)}°\n`;
        txt += `炮塔偏移 ${(aimYaw/DEG).toFixed(1)}° (相对车体)\n`;
        txt += `炮塔实际 ${(v.turretYaw/DEG).toFixed(1)}°\n`;
        txt += `俯仰     ${(v.pitch/DEG).toFixed(1)}°\n`;
        txt += `侧倾     ${(v.roll/DEG).toFixed(1)}°\n`;
        txt += `火炮     ${(v.gunPitch/DEG).toFixed(1)}° / ${(v.desiredGunPitch/DEG).toFixed(1)}°\n`;
        txt += `准星点   ${playerAimPoint.x.toFixed(0)}, ${playerAimPoint.y.toFixed(0)}, ${playerAimPoint.z.toFixed(0)}\n`;
        txt += `辅助锁定 ${assistLocked ? '是' : '否'}\n`;
        txt += `炮塔就绪 ${aimReady ? '是' : '否'}\n`;
      } else {
        txt += `俯仰     ${(v.pitch/DEG).toFixed(1)}°\n`;
        txt += `滚转     ${(v.roll/DEG).toFixed(1)}°\n`;
        txt += `离地     ${(v.pos.y - terrainHeight(v.pos.x, v.pos.z)).toFixed(1)} m\n`;
      }
      txt += `单位     ${world.vehicles.filter(x=>x.alive).length}\n`;
      txt += `弹丸     ${world.projectiles.length} / 炸弹 ${world.bombs.length}\n`;
      txt += `粒子     ${firePool.activeCount ? firePool.parts.filter(p=>p.alive).length : 0} / ${smokePool.parts.filter(p=>p.alive).length}`;
      hudEls.debugPanel.textContent = txt;
    }
  }

  mmTimer -= dt;
  if (mmTimer <= 0) {
    mmTimer = 0.06;
    drawMinimap();
  }

  renderer.render(scene, camera);
}

/* ============================================================
   31. 启动
   ============================================================ */
let selectedVehicle = 't34';
let currentTab = 'tank';

function buildVehiclePicker() {
  const box = document.getElementById('tankPick');
  box.innerHTML = '';

  const list = currentTab === 'tank'
    ? Object.entries(TANK_BLUEPRINTS)
    : Object.entries(AIRCRAFT_BLUEPRINTS);

  const ids = list.map(([id]) => id);
  if (!ids.includes(selectedVehicle)) selectedVehicle = ids[0];

  for (const [id, bp] of list) {
    const el = document.createElement('div');
    el.className = 'tpick' + (id === selectedVehicle ? ' sel' : '');

    if (bp.kind === 'tank') {
      el.innerHTML = `<b>${bp.name}</b>
        <span style="opacity:.65">${bp.tag}</span><br>
        穿深 ${bp.penMod > 1 ? '高' : bp.penMod > 0.95 ? '中' : '低'} ·
        装甲 ${bp.armor.hull.front}mm<br>
        装填 ${bp.reload.toFixed(1)}s · 极速 ${bp.maxSpeed}m/s`;
    } else {
      el.innerHTML = `<b>${bp.name}</b>
        <span style="opacity:.65">${bp.tag}</span><br>
        机炮 ${bp.gunDmg} dmg · 射速 ${(1/bp.fireRate).toFixed(1)}/s<br>
        炸弹 ${bp.bombs} 枚 · 极速 ${bp.maxSpeed}m/s`;
    }

    el.addEventListener('click', () => {
      selectedVehicle = id;
      [...box.children].forEach(c => c.classList.remove('sel'));
      el.classList.add('sel');
    });
    box.appendChild(el);
  }
}

document.querySelectorAll('.vtab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.vtab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    currentTab = tab.dataset.kind;
    buildVehiclePicker();
  });
});

buildVehiclePicker();

document.getElementById('startBtn').addEventListener('click', () => {
  Audio2.init();
  Audio2.resume();

  document.getElementById('overlay').classList.add('hidden');
  document.getElementById('hud').classList.remove('hidden');
  startBattle(selectedVehicle);
  drawMinimap();
  animate();
});
