<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>坦克对战 3D — Tank & Air Warfare Pro</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:#000;
              font-family:"Consolas","Microsoft YaHei",monospace; user-select:none; }
  canvas { display:block; }

  #hud { position:fixed; inset:0; pointer-events:none; color:#cfe8c0; z-index:10; }

  /* ================= 准星（含状态） ================= */
  #crosshair {
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    width:44px; height:44px;
    transition: opacity .12s;
  }
  #crosshair::before, #crosshair::after {
    content:''; position:absolute;
    background: rgba(255, 200, 80, .9);
    box-shadow:0 0 4px rgba(0,0,0,.9);
    transition: background .12s;
  }
  #crosshair::before { left:50%; top:0; width:2px; height:100%; margin-left:-1px; }
  #crosshair::after  { top:50%; left:0; height:2px; width:100%; margin-top:-1px; }

  #crosshair.ready::before, #crosshair.ready::after {
    background: rgba(140, 255, 120, .95);
  }
  #crosshair.locked::before, #crosshair.locked::after {
    background: rgba(120, 230, 255, .95);
  }

  #crosshair .dot {
    position:absolute; left:50%; top:50%; width:6px; height:6px; margin:-3px 0 0 -3px;
    border:1px solid rgba(255, 200, 80, .9); border-radius:50%;
    transition: border-color .12s;
  }
  #crosshair.ready .dot { border-color: rgba(140,255,120,.95); }
  #crosshair.locked .dot { border-color: rgba(120,230,255,.95); }

  #crosshair .ring {
    position:absolute; inset:-9px;
    border:1.5px solid transparent; border-radius:50%;
    transition: border-color .12s, box-shadow .12s;
  }
  #crosshair.locked .ring {
    border-color: rgba(120,230,255,.85);
    box-shadow: 0 0 14px rgba(120,230,255,.55);
    animation: lockPulse .85s ease-in-out infinite;
  }
  @keyframes lockPulse {
    0%,100% { transform: scale(1);   opacity:1; }
    50%     { transform: scale(.88); opacity:.65; }
  }

  /* ================= 顶部信息 ================= */
  #topbar {
    position:absolute; top:10px; left:50%; transform:translateX(-50%);
    display:flex; gap:26px; font-size:13px; letter-spacing:1px;
    background:rgba(0,0,0,.4); padding:6px 18px; border-radius:4px;
    border:1px solid rgba(120,180,100,.25);
  }
  .team-a { color:#8fd0ff; } .team-b { color:#ff8f8f; }

  #messages {
    position:absolute; top:60px; left:50%; transform:translateX(-50%);
    display:flex; flex-direction:column; align-items:center; gap:5px;
    font-size:14px; text-shadow:0 2px 6px #000;
  }
  .msg { background:rgba(0,0,0,.5); padding:3px 14px; border-radius:3px;
         animation: fadeOut 3.4s forwards; white-space:nowrap; }
  @keyframes fadeOut { 0%{opacity:0;transform:translateY(-8px);} 12%{opacity:1;transform:none;}
                       75%{opacity:1;} 100%{opacity:0;} }

  .panel {
    position:absolute; bottom:18px; background:rgba(6,12,6,.6);
    border:1px solid rgba(120,180,100,.3); border-radius:5px; padding:10px 14px;
    backdrop-filter: blur(3px);
  }
  #bottom-left  { left:18px;  width:280px; }
  #bottom-right { right:18px; width:250px; }

  .label { font-size:11px; opacity:.6; letter-spacing:2px; }
  .big   { font-size:19px; letter-spacing:1px; margin:1px 0 6px; }

  .bar { height:11px; background:rgba(0,0,0,.55); border-radius:2px; overflow:hidden;
         border:1px solid rgba(255,255,255,.12); }
  .bar > div { height:100%; width:100%; transition:width .12s linear; }
  #hp-fill     { background:linear-gradient(90deg,#59d05a,#a8e05a); }
  #reload-fill { background:linear-gradient(90deg,#e0b040,#f0e070); width:0%; }

  .row { display:flex; justify-content:space-between; align-items:center; margin-top:7px; }
  .shell-badge { display:inline-block; padding:2px 9px; border-radius:3px;
                 background:rgba(255,255,255,.12); font-size:12px; margin:2px 3px 0 0;}
  .shell-badge.active { background:rgba(160,240,120,.28); box-shadow:0 0 8px rgba(160,240,120,.4);}

  .mods { margin-top:7px; font-size:11px; line-height:1.65; opacity:.85; }
  .mod-ok   { color:#7ec87e; }
  .mod-bad  { color:#e05a5a; }

  /* ================= 炮镜 ================= */
  #scope { position:absolute; inset:0; z-index:12; pointer-events:none; }
  .scope-circle {
    position:absolute; left:50%; top:50%;
    width:min(88vh,88vw); height:min(88vh,88vw);
    transform:translate(-50%,-50%);
    border-radius:50%;
    box-shadow: 0 0 0 100vmax rgba(0,0,0,0.96),
                inset 0 0 70px rgba(0,0,0,0.9),
                inset 0 0 0 2px rgba(0,0,0,0.95);
    overflow:hidden;
    background:radial-gradient(circle at 50% 45%, rgba(255,255,255,0.05), transparent 60%);
  }
  .scope-svg { width:100%; height:100%; display:block; opacity:.92; }
  #scope-range {
    position:absolute; left:50%; bottom:12%; transform:translateX(-50%);
    color:#a0e878; font-size:15px; letter-spacing:2px;
    text-shadow:0 0 8px rgba(0,0,0,1), 0 0 3px #000;
  }
  #scope-info {
    position:absolute; left:50%; top:6%; transform:translateX(-50%);
    color:#8ec878; font-size:12px; letter-spacing:3px; text-shadow:0 0 8px #000;
  }

  /* ================= 小地图 ================= */
  #minimap {
    position:absolute; right:16px; top:14px;
    width:186px; height:186px;
    border:1px solid rgba(130,200,120,.45);
    border-radius:6px;
    background:rgba(6,14,8,.74);
    box-shadow:0 4px 26px rgba(0,0,0,.75), inset 0 0 22px rgba(0,0,0,.6);
    z-index:11;
  }
  #mmLabels {
    position:absolute; right:16px; top:2px; width:186px;
    font-size:10px; letter-spacing:2px; opacity:.55; text-align:center;
    color:#a8e898;
  }

  /* ================= 作弊菜单 ================= */
  #cheatMenu {
    position:fixed; right:16px; top:222px; z-index:30; width:262px;
    background:rgba(8,14,8,.93); border:1px solid rgba(140,220,120,.45);
    border-radius:6px; padding:12px 14px; color:#c8e8b8;
    font-size:12.5px; box-shadow:0 8px 40px rgba(0,0,0,.8);
    backdrop-filter: blur(6px);
  }
  #cheatMenu .cm-title {
    font-size:13px; letter-spacing:2px; color:#a8f080; margin-bottom:9px;
    display:flex; justify-content:space-between; align-items:center;
  }
  #cheatMenu .cm-hint { font-size:10px; opacity:.5; letter-spacing:0; }
  #cheatMenu label {
    display:flex; align-items:center; gap:8px; padding:4px 0;
    cursor:pointer; transition:.15s;
  }
  #cheatMenu label:hover { color:#e0ffd0; }
  #cheatMenu input[type=checkbox] {
    appearance:none; width:15px; height:15px; border:1px solid rgba(160,230,140,.5);
    border-radius:3px; background:rgba(0,0,0,.4); cursor:pointer; position:relative;
    flex-shrink:0;
  }
  #cheatMenu input[type=checkbox]:checked { background:#5da84a; border-color:#a8f080; }
  #cheatMenu input[type=checkbox]:checked::after {
    content:'✓'; position:absolute; left:2px; top:-2px; font-size:12px; color:#fff;
  }
  .cm-row { display:flex; align-items:center; gap:8px; padding:6px 0 2px; font-size:11.5px;}
  .cm-row input[type=range] { flex:1; accent-color:#8ee06a; }
  .cm-btns { display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-top:10px; }
  .cm-btns button {
    font-family:inherit; font-size:11.5px; padding:7px 4px; cursor:pointer;
    color:#c8f0b0; background:rgba(60,110,50,.35);
    border:1px solid rgba(160,240,130,.45); border-radius:4px;
    transition:.15s; letter-spacing:1px;
  }
  .cm-btns button:hover { background:rgba(100,180,80,.5); }
  .cm-btns button.wide { grid-column: span 2; }
  .cm-sep { height:1px; background:rgba(140,220,120,.2); margin:8px 0; }

  /* ================= 开场 / 结束 ================= */
  #overlay {
    position:fixed; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:18px;
    background:radial-gradient(circle at 50% 40%, rgba(20,30,20,.88), rgba(0,0,0,.97));
    color:#d8ecc8; z-index:50; text-align:center; overflow-y:auto; padding:36px 20px;
  }
  #overlay h1 { font-size:44px; letter-spacing:8px; font-weight:400;
                text-shadow:0 0 24px rgba(140,220,120,.45); }
  #overlay p  { font-size:13.5px; line-height:2.05; opacity:.8; letter-spacing:1px;
                max-width:780px; }
  #overlay .key { display:inline-block; padding:1px 8px; margin:0 2px;
                  border:1px solid rgba(180,240,160,.5); border-radius:3px;
                  background:rgba(255,255,255,.06); }
  #startBtn {
    pointer-events:auto; cursor:pointer; margin-top:8px;
    padding:13px 52px; font-size:17px; letter-spacing:4px;
    color:#c8f0b0; background:rgba(60,110,50,.35);
    border:1px solid rgba(160,240,130,.55); border-radius:4px;
    font-family:inherit; transition:.2s;
  }
  #startBtn:hover { background:rgba(90,170,70,.5); box-shadow:0 0 26px rgba(140,230,110,.35); }

  #vehicleTabs { display:flex; gap:6px; margin-bottom:4px; }
  .vtab {
    pointer-events:auto; cursor:pointer; padding:7px 24px; font-family:inherit;
    font-size:13px; letter-spacing:3px; color:#a8c898;
    background:rgba(0,0,0,.3); border:1px solid rgba(140,200,120,.3);
    border-radius:4px; transition:.18s;
  }
  .vtab:hover { border-color:rgba(180,255,150,.7); color:#d0f0c0; }
  .vtab.active { background:rgba(90,160,70,.35); border-color:#a8f080; color:#e0ffd0; }

  #tankPick { display:flex; gap:12px; flex-wrap:wrap; justify-content:center; max-width:880px; }
  .tpick {
    pointer-events:auto; cursor:pointer; width:152px; padding:11px 9px;
    border:1px solid rgba(160,220,140,.3); border-radius:4px;
    background:rgba(0,0,0,.35); color:#bcd8ac; font-family:inherit;
    font-size:11.5px; line-height:1.65; transition:.18s;
  }
  .tpick:hover { border-color:rgba(180,255,150,.85); background:rgba(70,120,60,.35); }
  .tpick.sel   { border-color:#a8f080; background:rgba(90,160,70,.4); box-shadow:0 0 18px rgba(140,230,110,.3); }
  .tpick b { display:block; font-size:14px; color:#e0f4d0; margin-bottom:3px; letter-spacing:1px; }

  #debugPanel {
    position:absolute; left:18px; top:70px; z-index:11;
    background:rgba(0,0,0,.6); border:1px solid rgba(120,180,100,.3);
    border-radius:5px; padding:8px 12px; font-size:11.5px; line-height:1.8;
    color:#9ed88e; white-space:pre;
  }

  .hidden { display:none !important; }
</style>
</head>

<script type="module">
import * as THREE from 'three';

/* ============================================================
   0. 工具
   ============================================================ */
const DEG = Math.PI/180;
const clamp = (v,a,b) => Math.min(b, Math.max(a, v));
const rand  = (a,b) => a + Math.random()*(b-a);
const lerp  = (a,b,t) => a + (b-a)*t;
const normAngle = a => { while(a>Math.PI) a-=Math.PI*2; while(a<-Math.PI) a+=Math.PI*2; return a; };
const approachAngle = (cur,tgt,max) => cur + clamp(normAngle(tgt-cur), -max, max);

const _tmpV1 = new THREE.Vector3();
const _tmpV2 = new THREE.Vector3();
const _tmpV3 = new THREE.Vector3();

/* ============================================================
   1. 地形
   ============================================================ */
const BOUND = 520;
const TERRAIN_SIZE = 1800;
const TERRAIN_SEG  = 300;

const PEAKS = [
  [-300, -250, 68, 230],
  [ 330,  180, 78, 260],
  [-200,  330, 58, 200],
  [ 260, -360, 72, 240],
  [ 480,  420, 90, 300],
  [-460,  -80, 62, 250],
];

function terrainHeight(x, z) {
  let h = 0;
  h += Math.sin(x*0.0032)*Math.cos(z*0.0028)*30;
  h += Math.sin(x*0.0071 + 1.7)*Math.cos(z*0.0064 + 0.9)*15;
  h += Math.sin(x*0.0172 + 2.3)*Math.cos(z*0.0158 + 1.4)*6.5;
  h += Math.sin(x*0.0431 + 0.7)*Math.cos(z*0.0397 + 2.9)*2.1;
  h += Math.sin(x*0.106 + 1.1)*Math.cos(z*0.098 + 0.3)*0.7;

  for (let i = 0; i < PEAKS.length; i++) {
    const p = PEAKS[i];
    const dx = x - p[0], dz = z - p[1];
    const s2 = p[3]*p[3]*0.25;
    h += p[2]*Math.exp(-(dx*dx + dz*dz)/(2*s2));
  }

  const dc = Math.hypot(x, z);
  const flat = clamp((dc - 150)/220, 0, 1);
  h *= (0.35 + 0.65*flat);
  return h;
}

/* ============================================================
   2. 渲染器 / 场景 / 相机
   ============================================================ */
const scene = new THREE.Scene();
const SKY_COLOR = 0xb7cfe4;
scene.fog = new THREE.Fog(SKY_COLOR, 380, 1900);

const camera = new THREE.PerspectiveCamera(62, innerWidth/innerHeight, 0.1, 4000);

const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// 天空
(function makeSky(){
  const geo = new THREE.SphereGeometry(2600, 32, 20);
  const mat = new THREE.ShaderMaterial({
    uniforms: {
      topColor:    { value: new THREE.Color(0x2a5a9e) },
      midColor:    { value: new THREE.Color(0x8fb6d8) },
      bottomColor: { value: new THREE.Color(0xd8e4ee) },
    },
    vertexShader: `
      varying vec3 vWorld;
      void main() {
        vec4 wp = modelMatrix * vec4(position, 1.0);
        vWorld = wp.xyz;
        gl_Position = projectionMatrix * viewMatrix * wp;
      }`,
    fragmentShader: `
      uniform vec3 topColor, midColor, bottomColor;
      varying vec3 vWorld;
      void main() {
        float h = normalize(vWorld).y;
        vec3 col;

(function buildTerrain(){
  const geo = new THREE.PlaneGeometry(TERRAIN_SIZE, TERRAIN_SIZE, TERRAIN_SEG, TERRAIN_SEG);
  geo.rotateX(-Math.PI/2);

  const pos = geo.attributes.position;
  const count = pos.count;
  const colors = new Float32Array(count*3);

  const cValley = new THREE.Color(0x3f5230);
  const cGrass  = new THREE.Color(0x556b38);
  const cGrass2 = new THREE.Color(0x6a7a42);
  const cRock   = new THREE.Color(0x6d6659);
  const cSnow   = new THREE.Color(0xe6eef4);
  const tmp = new THREE.Color();

  for (let i = 0; i < count; i++) {
    const x = pos.getX(i), z = pos.getZ(i);
    const h = terrainHeight(x, z);
    pos.setY(i, h);

    const t = clamp((h - 5)/95, 0, 1);
    if (t < 0.30)      tmp.copy(cValley).lerp(cGrass, t/0.30);
    else if (t < 0.62) tmp.copy(cGrass).lerp(cGrass2, (t-0.30)/0.32);
    else if (t < 0.86) tmp.copy(cGrass2).lerp(cRock, (t-0.62)/0.24);
    else               tmp.copy(cRock).lerp(cSnow, (t-0.86)/0.14);

    const n = 0.94 + (Math.sin(x*1.7)*Math.cos(z*1.3)*0.5 + 0.5)*0.12;
    colors[i*3]   = tmp.r*n;
    colors[i*3+1] = tmp.g*n;
    colors[i*3+2] = tmp.b*n;
  }

  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  geo.computeVertexNormals();

  terrainMesh = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({ vertexColors:true }));
  terrainMesh.receiveShadow = true;
  terrainMesh.userData = { terrain:true };
  scene.add(terrainMesh);
})();

const obstacles = [];

function addObstacle(x, z, w, h, d, color, rotY = 0, isBox = true) {
  let mesh;
  if (isBox) {
    mesh = new THREE.Mesh(
      new THREE.BoxGeometry(w, h, d),
      new THREE.MeshLambertMaterial({ color })
    );
  } else {
    mesh = new THREE.Mesh(
      new THREE.DodecahedronGeometry(Math.max(w,d)*0.62, 0),
      new THREE.MeshLambertMaterial({ color, flatShading:true })
    );
  }
  const baseY = terrainHeight(x, z);
  mesh.position.set(x, baseY + h/2 - 0.4, z);
  mesh.rotation.y = rotY;
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  mesh.userData = { obstacle:true };
  scene.add(mesh);
  staticHitMeshes.push(mesh);
  obstacles.push({ x, z, r: Math.max(w, d)*0.5 + 0.2 });
  return mesh;
}

const PARTICLE_VS = `
  attribute float aSize;
  attribute float aAlpha;
  attribute vec3  aColor;
  uniform float uPixelRatio;
  varying vec3  vColor;
  varying float vAlpha;
  void main() {
    vColor = aColor;
    vAlpha = aAlpha;
    vec4 mv = modelViewMatrix * vec4(position, 1.0);
    gl_PointSize = aSize * uPixelRatio * (330.0 / max(-mv.z, 0.15));
    gl_PointSize = clamp(gl_PointSize, 1.0, 320.0);
    gl_Position = projectionMatrix * mv;
  }
`;

const PARTICLE_FS = `
  varying vec3  vColor;
  varying float vAlpha;
  void main() {
    vec2 uv = gl_PointCoord - vec2(0.5);
    float d = dot(uv, uv);
    if (d > 0.25) discard;
    float a = smoothstep(0.25, 0.02, d);
    gl_FragColor = vec4(vColor, a * vAlpha);
  }
`;

class ParticlePool {
  constructor(max, blending) {
    this.max = max;
    this.positions = new Float32Array(max * 3);
    this.colors    = new Float32Array(max * 3);
    this.sizes     = new Float32Array(max);
    this.alphas    = new Float32Array(max);

    const geo = new THREE.BufferGeometry();
    const posAttr = new THREE.BufferAttribute(this.positions, 3);
    const colAttr = new THREE.BufferAttribute(this.colors, 3);
    const sizAttr = new THREE.BufferAttribute(this.sizes, 1);
    const alpAttr = new THREE.BufferAttribute(this.alphas, 1);
    posAttr.setUsage(THREE.DynamicDrawUsage);
    colAttr.setUsage(THREE.DynamicDrawUsage);
    sizAttr.setUsage(THREE.DynamicDrawUsage);
    alpAttr.setUsage(THREE.DynamicDrawUsage);

    geo.setAttribute('position', posAttr);
    geo.setAttribute('aColor',   colAttr);
    geo.setAttribute('aSize',    sizAttr);
    geo.setAttribute('aAlpha',   alpAttr);

    const mat = new THREE.ShaderMaterial({
      uniforms: { uPixelRatio: { value: Math.min(devicePixelRatio, 2) } },
      vertexShader: PARTICLE_VS,
      fragmentShader: PARTICLE_FS,
      transparent: true,
      depthWrite: false,
      depthTest: true,
      blending
    });

    this.geometry = geo;
    this.material = mat;
    this.points = new THREE.Points(geo, mat);
    this.points.frustumCulled = false;
    this.points.renderOrder = 5;
    scene.add(this.points);

    this.parts = new Array(max);
    for (let i = 0; i < max; i++) {
      this.parts[i] = {
        alive:false, x:0,y:0,z:0, vx:0,vy:0,vz:0,
        r:1,g:1,b:1, size:1, alpha:1, life:1, maxLife:1,
        drag:1.2, gravity:0, growth:0
      };
    }
    this.cursor = 0;
    this.activeCount = 0;
  }

  emit(opt) {
    let p = null;
    // 找空闲槽位（环形扫描，最多扫 max 次）
    for (let i = 0; i < this.max; i++) {
      const idx = (this.cursor + i) % this.max;
      if (!this.parts[idx].alive) { p = this.parts[idx]; this.cursor = (idx + 1) % this.max; break; }
    }
    if (!p) { p = this.parts[this.cursor]; this.cursor = (this.cursor + 1) % this.max; }

    p.alive   = true;
    p.x = opt.x; p.y = opt.y; p.z = opt.z;
    p.vx = opt.vx || 0; p.vy = opt.vy || 0; p.vz = opt.vz || 0;
    p.r = opt.r; p.g = opt.g; p.b = opt.b;
    p.size   = opt.size;
    p.alpha  = opt.alpha !== undefined ? opt.alpha : 1;
    p.life   = opt.life;
    p.maxLife = opt.life;
    p.drag   = opt.drag !== undefined ? opt.drag : 1.4;
    p.gravity= opt.gravity !== undefined ? opt.gravity : 0;
    p.growth = opt.growth !== undefined ? opt.growth : 0.5;
  }

  update(dt) {
    const pos = this.positions, col = this.colors, sz = this.sizes, al = this.alphas;
    let any = false;

    for (let i = 0; i < this.max; i++) {
      const p = this.parts[i];
      const i3 = i * 3;

      if (!p.alive) {
        if (sz[i] !== 0) { sz[i] = 0; al[i] = 0; }
        continue;
      }

      p.life -= dt;
      if (p.life <= 0) {
        p.alive = false;
        sz[i] = 0; al[i] = 0;
        continue;
      }

      any = true;
      const t = 1 - p.life / p.maxLife;   // 0 → 1

      // 物理
      p.vy -= p.gravity * dt;
      const damp = Math.exp(-p.drag * dt);
      p.vx *= damp; p.vy *= damp; p.vz *= damp;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.z += p.vz * dt;

      pos[i3]   = p.x;
      pos[i3+1] = p.y;
      pos[i3+2] = p.z;

      // 颜色（火焰向暗红过渡；烟雾向深灰过渡）
      const fade = 1 - t * 0.75;
      col[i3]   = p.r * fade;
      col[i3+1] = p.g * fade * fade;
      col[i3+2] = p.b * fade * fade * fade;

      // 大小 / 透明度
      sz[i] = p.size * (1 + p.growth * t);
      // 前 12% 快速显现，之后线性淡出
      let a;
      if (t < 0.12) a = p.alpha * (t / 0.12);
      else          a = p.alpha * (1 - (t - 0.12) / 0.88);
      al[i] = Math.max(0, a);
    }

    this.activeCount = any ? 1 : 0;

    this.geometry.attributes.position.needsUpdate = true;
    this.geometry.attributes.aColor.needsUpdate   = true;
    this.geometry.attributes.aSize.needsUpdate    = true;
    this.geometry.attributes.aAlpha.needsUpdate   = true;
  }
}
