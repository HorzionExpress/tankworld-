const Audio2 = {
  ctx: null,
  master: null,
  noiseBuf: null,
  ready: false,
  volume: 0.6,

  init() {
    if (this.ready) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try {
      this.ctx = new AC();
    } catch (e) {
      return;
    }
    this.master = this.ctx.createGain();
    this.master.gain.value = this.volume;
    this.master.connect(this.ctx.destination);

    // 白噪声缓冲（2 秒）
    const len = Math.floor(this.ctx.sampleRate * 2);
    const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    this.noiseBuf = buf;
    this.ready = true;
  },

  resume() {
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
  },

  setVolume(v) {
    this.volume = v;
    if (this.master) this.master.gain.value = v;
  },

  _noise() {
    const s = this.ctx.createBufferSource();
    s.buffer = this.noiseBuf;
    s.loop = true;
    return s;
  },

  /* 距离衰减 + 左右声道 */
  _spatial(pos) {
    const ctx = this.ctx;
    const d = camera.position.distanceTo(pos);
    const vol = 1 / (1 + d * d / 5200);
    const maxD = 620;
    const dist = clamp(1 - d / maxD, 0, 1);
    const panner = ctx.createStereoPanner();
    const camDir = _tmpV1;
    camera.getWorldDirection(camDir);
    const toObj = _tmpV2.subVectors(pos, camera.position).normalize();
    const right = _tmpV3.set(camDir.z, 0, -camDir.x).normalize();
    const pan = clamp(toObj.dot(right), -1, 1);
    panner.pan.value = pan * 0.85;
    return { panner, gain: vol * dist, dist };
  },

  /* ---- 开火 ---- */
  playShot(pos, big = false) {
    if (!this.ready) return;
    const ctx = this.ctx, t = ctx.currentTime;
    const sp = this._spatial(pos);
    const g0 = sp.gain * (big ? 1.0 : 0.72);
    if (g0 < 0.006) return;

    // 1) 噪声爆响
    const src = this._noise();
    const filt = ctx.createBiquadFilter();
    filt.type = 'lowpass';
    filt.Q.value = 0.9;
    filt.frequency.setValueAtTime(big ? 3800 : 5200, t);
    filt.frequency.exponentialRampToValueAtTime(big ? 130 : 220, t + (big ? 0.75 : 0.45));

    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(g0, t + 0.004);
    g.gain.exponentialRampToValueAtTime(0.0001, t + (big ? 1.0 : 0.6));

    src.connect(filt).connect(g).connect(sp.panner).connect(this.master);
    src.start(t);
    src.stop(t + 1.4);

    // 2) 低频冲击
    const osc = ctx.createOscillator();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(big ? 165 : 235, t);
    osc.frequency.exponentialRampToValueAtTime(big ? 32 : 48, t + 0.42);

    const g2 = ctx.createGain();
    g2.gain.setValueAtTime(0.0001, t);
    g2.gain.linearRampToValueAtTime(g0 * 0.95, t + 0.008);
    g2.gain.exponentialRampToValueAtTime(0.0001, t + 0.5);

    osc.connect(g2).connect(sp.panner).connect(this.master);
    osc.start(t);
    osc.stop(t + 0.6);

    // 3) 金属余音（在近距离时）
    if (sp.dist > 0.5) {
      const ring = ctx.createOscillator();
      ring.type = 'triangle';
      ring.frequency.value = rand(1600, 2600);
      const g3 = ctx.createGain();
      g3.gain.setValueAtTime(0.0001, t + 0.01);
      g3.gain.linearRampToValueAtTime(g0 * 0.10, t + 0.02);
      g3.gain.exponentialRampToValueAtTime(0.0001, t + 0.35);
      ring.connect(g3).connect(sp.panner).connect(this.master);
      ring.start(t + 0.01);
      ring.stop(t + 0.4);
    }
  },

  /* ---- 爆炸 ---- */
  playExplosion(pos, scale = 1) {
    if (!this.ready) return;
    const ctx = this.ctx, t = ctx.currentTime;
    const sp = this._spatial(pos);
    const g0 = sp.gain * 1.0 * clamp(scale, 0.3, 2.5);
    if (g0 < 0.006) return;

    // 低频冲击
    const osc = ctx.createOscillator();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(90, t);
    osc.frequency.exponentialRampToValueAtTime(22, t + 0.9);
    const g1 = ctx.createGain();
    g1.gain.setValueAtTime(0.0001, t);
    g1.gain.linearRampToValueAtTime(g0 * 1.1, t + 0.01);
    g1.gain.exponentialRampToValueAtTime(0.0001, t + 1.4);
    osc.connect(g1).connect(sp.panner).connect(this.master);
    osc.start(t);
    osc.stop(t + 1.6);

    // 噪声爆炸
    const src = this._noise();
    const filt = ctx.createBiquadFilter();
    filt.type = 'lowpass';
    filt.Q.value = 0.7;
    filt.frequency.setValueAtTime(4200, t);
    filt.frequency.exponentialRampToValueAtTime(90, t + 1.1);
    const g2 = ctx.createGain();
    g2.gain.setValueAtTime(0.0001, t);
    g2.gain.linearRampToValueAtTime(g0, t + 0.012);
    g2.gain.exponentialRampToValueAtTime(0.0001, t + 1.5);
    src.connect(filt).connect(g2).connect(sp.panner).connect(this.master);
    src.start(t);
    src.stop(t + 1.8);

    // 碎片高频噼啪
    const src2 = this._noise();
    const bp = ctx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.value = rand(2200, 3600);
    bp.Q.value = 1.4;
    const g3 = ctx.createGain();
    g3.gain.setValueAtTime(0.0001, t + 0.03);
    g3.gain.linearRampToValueAtTime(g0 * 0.22, t + 0.06);
    g3.gain.exponentialRampToValueAtTime(0.0001, t + 0.7);
    src2.connect(bp).connect(g3).connect(sp.panner).connect(this.master);
    src2.start(t + 0.03);
    src2.stop(t + 0.9);
  },

  /* ---- 金属命中 ---- */
  playImpact(pos, heavy = false) {
    if (!this.ready) return;
    const ctx = this.ctx, t = ctx.currentTime;
    const sp = this._spatial(pos);
    const g0 = sp.gain * (heavy ? 0.75 : 0.5);
    if (g0 < 0.008) return;

    // 金属叮
    const osc = ctx.createOscillator();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(rand(1800, 3200), t);
    osc.frequency.exponentialRampToValueAtTime(rand(600, 1000), t + 0.22);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(g0, t + 0.004);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.30);
    osc.connect(g).connect(sp.panner).connect(this.master);
    osc.start(t);
    osc.stop(t + 0.35);

    // 金属噪声
    const src = this._noise();
    const bp = ctx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.value = rand(1200, 2600);
    bp.Q.value = 2.0;
    const g2 = ctx.createGain();
    g2.gain.setValueAtTime(0.0001, t);
    g2.gain.linearRampToValueAtTime(g0 * 0.7, t + 0.005);
    g2.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
    src.connect(bp).connect(g2).connect(sp.panner).connect(this.master);
    src.start(t);
    src.stop(t + 0.3);
  },

  /* ---- 跳弹 ---- */
  playRicochet(pos) {
    if (!this.ready) return;
    const ctx = this.ctx, t = ctx.currentTime;
    const sp = this._spatial(pos);
    const g0 = sp.gain * 0.55;
    if (g0 < 0.008) return;

    const osc = ctx.createOscillator();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(rand(2600, 3800), t);
    osc.frequency.exponentialRampToValueAtTime(rand(900, 1400), t + 0.28);
    const bp = ctx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.value = 2600;
    bp.Q.value = 5;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(g0, t + 0.004);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.32);
    osc.connect(bp).connect(g).connect(sp.panner).connect(this.master);
    osc.start(t);
    osc.stop(t + 0.36);
  },

  /* ---- 未击穿（闷响） ---- */
  playNonPen(pos) {
    if (!this.ready) return;
    const ctx = this.ctx, t = ctx.currentTime;
    const sp = this._spatial(pos);
    const g0 = sp.gain * 0.55;
    if (g0 < 0.008) return;

    const src = this._noise();
    const filt = ctx.createBiquadFilter();
    filt.type = 'lowpass';
    filt.frequency.setValueAtTime(900, t);
    filt.frequency.exponentialRampToValueAtTime(180, t + 0.2);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(g0, t + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.26);
    src.connect(filt).connect(g).connect(sp.panner).connect(this.master);
    src.start(t);
    src.stop(t + 0.35);
  },

  /* ---- 机枪点射 ---- */
  playMG(pos) {
    if (!this.ready) return;
    const ctx = this.ctx, t = ctx.currentTime;
    const sp = this._spatial(pos);
    const g0 = sp.gain * 0.30;
    if (g0 < 0.01) return;

    const src = this._noise();
    const filt = ctx.createBiquadFilter();
    filt.type = 'highpass';
    filt.frequency.value = 700;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(g0, t + 0.001);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.055);
    src.connect(filt).connect(g).connect(sp.panner).connect(this.master);
    src.start(t);
    src.stop(t + 0.1);
  },

  /* ---- 引擎声 ---- */
  createEngineVoice(baseFreq = 58) {
    if (!this.ready) return null;
    const ctx = this.ctx;

    const gOut = ctx.createGain();
    gOut.gain.value = 0;

    const filt = ctx.createBiquadFilter();
    filt.type = 'lowpass';
    filt.frequency.value = 400;
    filt.Q.value = 1.6;

    const o1 = ctx.createOscillator();
    o1.type = 'sawtooth';
    o1.frequency.value = baseFreq;

    const o2 = ctx.createOscillator();
    o2.type = 'square';
    o2.frequency.value = baseFreq * 0.5;

    const o3 = ctx.createOscillator();
    o3.type = 'triangle';
    o3.frequency.value = baseFreq * 2.02;

    const g1 = ctx.createGain(); g1.gain.value = 0.50;
    const g2 = ctx.createGain(); g2.gain.value = 0.36;
    const g3 = ctx.createGain(); g3.gain.value = 0.14;

    o1.connect(g1).connect(filt);
    o2.connect(g2).connect(filt);
    o3.connect(g3).connect(filt);

    const pan = ctx.createStereoPanner();
    filt.connect(gOut);
    gOut.connect(pan);
    pan.connect(this.master);

    o1.start(); o2.start(); o3.start();

    const now = () => ctx.currentTime;

    return {
      setVolume(v) {
        gOut.gain.setTargetAtTime(Math.max(0, v), now(), 0.09);
      },
      setRpm(r, moving) {
        const f = baseFreq * (0.75 + r * 2.0);
        o1.frequency.setTargetAtTime(f, now(), 0.10);
        o2.frequency.setTargetAtTime(f * 0.5, now(), 0.10);
        o3.frequency.setTargetAtTime(f * 2.02, now(), 0.10);
        const cut = moving ? (260 + r * 1200) : 220;
        filt.frequency.setTargetAtTime(cut, now(), 0.14);
      },
      setPan(p) {
        pan.pan.setTargetAtTime(clamp(p, -1, 1), now(), 0.12);
      },
      stop() {
        try {
          gOut.gain.setTargetAtTime(0, now(), 0.05);
          setTimeout(() => {
            try { o1.stop(); o2.stop(); o3.stop(); } catch (e) {}
          }, 260);
        } catch (e) {}
      }
    };
  }
};

/* ============================================================
   12. 坦克
   ============================================================ */
let TANK_UID = 0;

/* ---------- 共享几何体缓存 ---------- */
const GEO = {
  box: {},
  cyl: {},
  sph: {}
};
function boxGeo(w,h,d) {
  const k = w.toFixed(2)+'_'+h.toFixed(2)+'_'+d.toFixed(2);
  if (!GEO.box[k]) GEO.box[k] = new THREE.BoxGeometry(w,h,d);
  return GEO.box[k];
}
function cylGeo(rt, rb, h, seg) {
  const k = rt.toFixed(2)+'_'+rb.toFixed(2)+'_'+h.toFixed(2)+'_'+seg;
  if (!GEO.cyl[k]) GEO.cyl[k] = new THREE.CylinderGeometry(rt, rb, h, seg);
  return GEO.cyl[k];
}

class Tank {
  constructor(bpId, team, isPlayer = false) {
    this.uid = TANK_UID++;
    this.bp = TANK_BLUEPRINTS[bpId];
    this.bpId = bpId;
    this.kind = 'tank';
    this.team = team;
    this.isPlayer = isPlayer;

    this.maxHp = this.bp.hp;
    this.hp = this.maxHp;
    this.crew = this.bp.crew;
    this.alive = true;

    this.pos = new THREE.Vector3();
    this.prevPos = new THREE.Vector3();
    this.velVec = new THREE.Vector3();
    this.yaw = 0;
    this.speed = 0;
    this.yVel = 0;

    this.pitch = 0;
    this.roll = 0;
    this.leanRoll = 0;
    this.visualYaw = 0;

    this.turretYaw = 0;
    this.gunPitch = 0;
    this.desiredTurretWorldYaw = 0;
    this.desiredGunPitch = 0;

    this.forwardInput = 0;
    this.turnInput = 0;

    this.reloadTime = 0;
    this.ammo = {};
    for (const s of this.bp.shells) this.ammo[s] = 40;
    this.currentShell = this.bp.shells[0];

    this.modules = { engine:true, turretRing:true, gun:true, driver:true };
    this.radius = Math.max(this.bp.hull.w, this.bp.hull.l) * 0.42;

    this.wheelSpin = 0;
    this.engineVoice = null;
    this._smokeTimer = 0;

    this.buildMesh();
  }

  /* ==========================================================
     建模：高细节坦克
     ========================================================== */
  buildMesh() {
    const bp = this.bp;
    const H = bp.hull;
    const T = bp.turret;

    const root = new THREE.Group();
    this.root = root;

    const colBase  = new THREE.Color(bp.color);
    const colDark  = colBase.clone().multiplyScalar(0.60);
    const colDeep  = colBase.clone().multiplyScalar(0.40);
    const colLight = colBase.clone().multiplyScalar(1.22);

    const mHull   = new THREE.MeshLambertMaterial({ color: colBase });
    const mHullD  = new THREE.MeshLambertMaterial({ color: colDark });
    const mHullL  = new THREE.MeshLambertMaterial({ color: colLight });
    const mHullX  = new THREE.MeshLambertMaterial({ color: colDeep });
    const mTrack  = new THREE.MeshLambertMaterial({ color: 0x26261f });
    const mWheel  = new THREE.MeshLambertMaterial({ color: 0x3a3a30 });
    const mRubber = new THREE.MeshLambertMaterial({ color: 0x141414 });
    const mMetal  = new THREE.MeshLambertMaterial({ color: 0x4e5048 });
    const mSteel  = new THREE.MeshLambertMaterial({ color: 0x6e7068 });
    const mGlass  = new THREE.MeshLambertMaterial({
      color: 0xc8e0ee, emissive: 0x2a3a44, emissiveIntensity: 0.7
    });

    this._mats = [mHull, mHullD, mHullL, mHullX, mTrack, mWheel, mRubber, mMetal, mSteel, mGlass];

    const noRay = o => { o.raycast = () => {}; return o; };
    const cast  = o => { o.castShadow = true; o.receiveShadow = true; return o; };
    const castS = o => { o.castShadow = true; return o; };

    /* ==================================================
       车体
       ================================================== */
    const hullGrp = new THREE.Group();
    root.add(hullGrp);
    this.hullGroup = hullGrp;

    // 主体
    const hullBody = new THREE.Mesh(boxGeo(H.w, H.h, H.l), mHull);
    hullBody.position.y = H.h * 0.5;
    hullBody.castShadow = true;
    hullBody.receiveShadow = true;
    noRay(hullBody);
    hullGrp.add(hullBody);

    // 首上装甲（倾斜）
    const ufpAngle = bp.style === 'german' ? 0.30 : (bp.style === 'soviet' ? 0.62 : 0.48);
    const ufp = new THREE.Mesh(boxGeo(H.w*0.97, 0.16, H.l*0.42), mHullL);
    ufp.position.set(0, H.h*0.80, H.l*0.30);
    ufp.rotation.x = ufpAngle;
    cast(ufp); noRay(ufp);
    hullGrp.add(ufp);

    // 首下装甲
    const lfp = new THREE.Mesh(boxGeo(H.w*0.92, 0.15, H.l*0.28), mHullD);
    lfp.position.set(0, H.h*0.24, H.l*0.44);
    lfp.rotation.x = -0.78;
    cast(lfp); noRay(lfp);
    hullGrp.add(lfp);

    // 尾板
    const rearPlate = new THREE.Mesh(boxGeo(H.w*0.98, H.h*0.92, 0.16), mHullD);
    rearPlate.position.set(0, H.h*0.48, -H.l*0.49);
    cast(rearPlate); noRay(rearPlate);
    hullGrp.add(rearPlate);

    // 发动机舱盖板
    const deck = new THREE.Mesh(boxGeo(H.w*0.90, 0.14, H.l*0.36), mHullD);
    deck.position.set(0, H.h*1.02, -H.l*0.28);
    noRay(deck);
    hullGrp.add(deck);

    // 舱盖格栅
    for (let i = -2; i <= 2; i++) {
      const slat = new THREE.Mesh(boxGeo(H.w*0.72, 0.05, 0.10), mMetal);
      slat.position.set(0, H.h*1.10, -H.l*0.28 + i*0.42);
      noRay(slat);
      hullGrp.add(slat);
    }

    // 排气管
    for (const sx of [-1, 1]) {
      const pipe = new THREE.Mesh(cylGeo(0.13, 0.16, H.l*0.24, 8), mMetal);
      pipe.rotation.x = Math.PI/2;
      pipe.position.set(sx*H.w*0.40, H.h*0.72, -H.l*0.44);
      castS(pipe); noRay(pipe);
      hullGrp.add(pipe);

      const tip = new THREE.Mesh(cylGeo(0.17, 0.17, 0.12, 8), mHullX);
      tip.rotation.x = Math.PI/2;
      tip.position.set(sx*H.w*0.40, H.h*0.72, -H.l*0.56);
      noRay(tip);
      hullGrp.add(tip);
    }

    // 翼子板 + 侧储物箱
    for (const sx of [-1, 1]) {
      const fender = new THREE.Mesh(boxGeo(0.58, 0.10, H.l*0.94), mHullD);
      fender.position.set(sx*(H.w*0.5 + 0.26), H.h*0.96, 0);
      cast(fender); noRay(fender);
      hullGrp.add(fender);

      // 工具箱
      const tb = new THREE.Mesh(boxGeo(0.38, 0.36, H.l*0.22), mHullX);
      tb.position.set(sx*(H.w*0.5 + 0.24), H.h*1.05 + 0.20, -H.l*0.16);
      castS(tb); noRay(tb);
      hullGrp.add(tb);

      // 备用履带块
      const spare = new THREE.Mesh(boxGeo(0.30, 0.14, H.l*0.12), mTrack);
      spare.position.set(sx*(H.w*0.5 + 0.24), H.h*1.05 + 0.10, H.l*0.24);
      noRay(spare);
      hullGrp.add(spare);
    }

    // 前大灯
    for (const sx of [-1, 1]) {
      const lampBase = new THREE.Mesh(cylGeo(0.17, 0.17, 0.10, 10), mSteel);
      lampBase.rotation.x = Math.PI/2;
      lampBase.position.set(sx*H.w*0.34, H.h*1.02, H.l*0.47);
      noRay(lampBase);
      hullGrp.add(lampBase);

      const lens = new THREE.Mesh(cylGeo(0.135, 0.135, 0.05, 10), mGlass);
      lens.rotation.x = Math.PI/2;
      lens.position.set(sx*H.w*0.34, H.h*1.02, H.l*0.505);
      noRay(lens);
      hullGrp.add(lens);
    }

    // 牵引钩
    for (const sx of [-1, 1]) {
      const hook = new THREE.Mesh(boxGeo(0.16, 0.22, 0.30), mMetal);
      hook.position.set(sx*H.w*0.30, H.h*0.36, -H.l*0.53);
      noRay(hook);
      hullGrp.add(hook);
    }

    // 车体顶部细节（天线基座/潜望镜）
    const peri = new THREE.Mesh(boxGeo(0.22, 0.16, 0.22), mMetal);
    peri.position.set(H.w*0.26, H.h*1.06, H.l*0.16);
    noRay(peri);
    hullGrp.add(peri);

    /* ==================================================
       履带 & 负重轮
       ================================================== */
    const wheelMeshes = [];
    const trackGroups = [];

    const rW = H.h * 0.37;
    const wheelCount = H.l > 6.4 ? 6 : 5;
    const wheelSpan = H.l * 0.70;

    for (const sx of [-1, 1]) {
      const tGrp = new THREE.Group();
      tGrp.position.set(sx * (H.w * 0.5 + 0.36), H.h * 0.46, 0);
      root.add(tGrp);
      trackGroups.push(tGrp);

      // 履带带
      const bandGeo = boxGeo(0.70, H.h * 0.96, H.l * 1.01);
      const band = new THREE.Mesh(bandGeo, mTrack);
      band.castShadow = true;
      band.receiveShadow = true;
      noRay(band);
      tGrp.add(band);

      // 履带外侧花纹（小方块链）
      for (let i = 0; i < 14; i++) {
        const zz = -H.l * 0.48 + (i / 13) * H.l * 0.96;
        const link = new THREE.Mesh(boxGeo(0.74, 0.055, H.l * 0.045), mHullX);
        link.position.set(0, -H.h * 0.47, zz);
        noRay(link);
        tGrp.add(link);

        const link2 = new THREE.Mesh(boxGeo(0.74, 0.055, H.l * 0.045), mHullX);
        link2.position.set(0, H.h * 0.47, zz);
        noRay(link2);
        tGrp.add(link2);
      }

      // 负重轮
      const wheelGeo = cylGeo(rW, rW, 0.72, 14);
      wheelGeo.rotateZ(Math.PI / 2);

      for (let i = 0; i < wheelCount; i++) {
        const zz = -wheelSpan * 0.5 + (i / (wheelCount - 1)) * wheelSpan;
        const w = new THREE.Mesh(wheelGeo, mWheel);
        w.position.set(0, -H.h * 0.02, zz);
        w.castShadow = true;
        noRay(w);
        tGrp.add(w);
        wheelMeshes.push(w);

        // 轮毂标记（让旋转可见）
        const spoke = new THREE.Mesh(boxGeo(0.78, rW * 1.5, 0.10), mRubber);
        spoke.position.copy(w.position);
        spoke.rotation.x = 0;
        noRay(spoke);
        tGrp.add(spoke);
        w.userData.spoke = spoke;

        // 轮缘橡胶
        const ringGeo = new THREE.TorusGeometry(rW * 0.86, 0.09, 6, 14);
        ringGeo.rotateY(Math.PI / 2);
        const ring = new THREE.Mesh(ringGeo, mRubber);
        ring.position.copy(w.position);
        noRay(ring);
        tGrp.add(ring);
        w.userData.ring = ring;
      }

      // 主动轮（后）
      const sprocketGeo = cylGeo(rW * 1.15, rW * 1.15, 0.68, 12);
      sprocketGeo.rotateZ(Math.PI / 2);
      const sprocket = new THREE.Mesh(sprocketGeo, mSteel);
      sprocket.position.set(0, H.h * 0.02, -H.l * 0.42);
      castS(sprocket);
      noRay(sprocket);
      tGrp.add(sprocket);
      wheelMeshes.push(sprocket);

      // 诱导轮（前）
      const idlerGeo = cylGeo(rW * 0.92, rW * 0.92, 0.62, 12);
      idlerGeo.rotateZ(Math.PI / 2);
      const idler = new THREE.Mesh(idlerGeo, mWheel);
      idler.position.set(0, H.h * 0.04, H.l * 0.44);
      castS(idler);
      noRay(idler);
      tGrp.add(idler);
      wheelMeshes.push(idler);

      // 托带轮
      for (let i = 0; i < 3; i++) {
        const ret = new THREE.Mesh(cylGeo(0.16, 0.16, 0.40, 8), mWheel);
        ret.rotation.z = Math.PI / 2;
        ret.position.set(0, H.h * 0.44, -wheelSpan * 0.35 + i * wheelSpan * 0.35);
        noRay(ret);
        tGrp.add(ret);
      }
    }

    this.wheelMeshes = wheelMeshes;
    this.trackGroups = trackGroups;

    /* ==================================================
       炮塔
       ================================================== */
    const turretGroup = new THREE.Group();
    turretGroup.position.set(0, H.h, T.z);
    root.add(turretGroup);
    this.turretGroup = turretGroup;

    // 炮塔主体（八边形柱体，缩放成椭圆截面）
    const tGeo = new THREE.CylinderGeometry(1, 1.06, T.h, 8);
    tGeo.rotateY(Math.PI / 8);
    tGeo.scale(T.w * 0.53, 1, T.l * 0.56);

    const turretBody = new THREE.Mesh(tGeo, mHull);
    turretBody.position.y = T.h * 0.5;
    turretBody.castShadow = true;
    turretBody.receiveShadow = true;
    noRay(turretBody);
    turretGroup.add(turretBody);
    this.turretMesh = turretBody;

    // 炮塔顶板
    const roofGeo = new THREE.CylinderGeometry(1, 1, 0.10, 8);
    roofGeo.rotateY(Math.PI / 8);
    roofGeo.scale(T.w * 0.50, 1, T.l * 0.53);
    const roof = new THREE.Mesh(roofGeo, mHullL);
    roof.position.y = T.h * 0.98;
    noRay(roof);
    turretGroup.add(roof);

    // 炮盾 / 防盾
    const mantletGeo = new THREE.CylinderGeometry(0.58, 0.62, 0.55, 12);
    mantletGeo.rotateX(Math.PI / 2);
    const mantlet = new THREE.Mesh(mantletGeo, mHullD);
    mantlet.position.set(0, T.h * 0.48, T.l * 0.42);
    cast(mantlet); noRay(mantlet);
    turretGroup.add(mantlet);

    // 指挥塔
    const cupola = new THREE.Mesh(cylGeo(0.36, 0.40, 0.34, 10), mMetal);
    cupola.position.set(T.w * 0.18, T.h + 0.18, -T.l * 0.20);
    castS(cupola); noRay(cupola);
    turretGroup.add(cupola);

    const cupolaHatch = new THREE.Mesh(cylGeo(0.30, 0.30, 0.07, 10), mHullD);
    cupolaHatch.position.set(T.w * 0.18, T.h + 0.37, -T.l * 0.20);
    noRay(cupolaHatch);
    turretGroup.add(cupolaHatch);

    // 装填手舱盖
    const loaderHatch = new THREE.Mesh(cylGeo(0.28, 0.28, 0.09, 10), mHullD);
    loaderHatch.position.set(-T.w * 0.24, T.h + 0.06, -T.l * 0.12);
    noRay(loaderHatch);
    turretGroup.add(loaderHatch);

    // 潜望镜
    const periT = new THREE.Mesh(boxGeo(0.18, 0.13, 0.20), mMetal);
    periT.position.set(T.w * 0.30, T.h + 0.12, T.l * 0.12);
    noRay(periT);
    turretGroup.add(periT);

    // 炮塔侧面储物篮（苏/美风格）
    if (bp.style !== 'german') {
      for (const sx of [-1, 1]) {
        const basket = new THREE.Mesh(boxGeo(0.10, 0.42, T.l * 0.62), mHullX);
        basket.position.set(sx * (T.w * 0.55), T.h * 0.42, -T.l * 0.12);
        noRay(basket);
        turretGroup.add(basket);
      }
    }

    // 天线
    const antenna = new THREE.Mesh(cylGeo(0.028, 0.028, 1.5, 5), mMetal);
    antenna.position.set(-T.w * 0.30, T.h + 0.80, -T.l * 0.28);
    antenna.rotation.z = 0.14;
    noRay(antenna);
    turretGroup.add(antenna);

    // 同轴机枪
    const coax = new THREE.Mesh(cylGeo(0.055, 0.055, 0.75, 6), mMetal);
    coax.rotation.x = Math.PI/2;
    coax.position.set(T.w * 0.22, T.h * 0.50, T.l * 0.40);
    noRay(coax);
    turretGroup.add(coax);

    /* ==================================================
       火炮
       ================================================== */
    const gunPivot = new THREE.Group();
    gunPivot.position.set(0, T.h * 0.46, T.l * 0.30);
    turretGroup.add(gunPivot);
    this.gunPivot = gunPivot;

    const L = bp.gunLen;

    // 炮管（带轻微锥度）
    const barrelGeo = new THREE.CylinderGeometry(0.105, 0.145, L, 10);
    barrelGeo.rotateX(Math.PI / 2);
    barrelGeo.translate(0, 0, L / 2);
    const barrel = new THREE.Mesh(barrelGeo, mSteel);
    barrel.castShadow = true;
    noRay(barrel);
    gunPivot.add(barrel);

    // 炮口制退器
    const brake1 = new THREE.Mesh(cylGeo(0.20, 0.20, 0.42, 10), mMetal);
    brake1.rotation.x = Math.PI / 2;
    brake1.position.z = L - 0.24;
    castS(brake1); noRay(brake1);
    gunPivot.add(brake1);

    const brake2 = new THREE.Mesh(cylGeo(0.23, 0.23, 0.10, 10), mMetal);
    brake2.rotation.x = Math.PI / 2;
    brake2.position.z = L - 0.24;
    noRay(brake2);
    gunPivot.add(brake2);

    // 炮管加强箍
    for (let i = 0; i < 3; i++) {
      const clamp = new THREE.Mesh(cylGeo(0.165, 0.165, 0.09, 10), mMetal);
      clamp.rotation.x = Math.PI / 2;
      clamp.position.z = L * (0.28 + i * 0.20);
      noRay(clamp);
      gunPivot.add(clamp);
    }

    // 炮口定位点
    this.muzzle = new THREE.Object3D();
    this.muzzle.position.set(0, 0, L + 0.1);
    gunPivot.add(this.muzzle);

    /* ==================================================
       命中代理盒（不可见，但参与射线检测）
       ================================================== */
    const proxyMat = new THREE.MeshBasicMaterial({ visible: false });

    const proxyHull = new THREE.Mesh(
      boxGeo(H.w * 0.98, H.h * 1.02, H.l * 0.98), proxyMat
    );
    proxyHull.position.y = H.h * 0.5;
    proxyHull.userData = { tank: this, part: 'hull' };
    hullGrp.add(proxyHull);

    const proxyTurret = new THREE.Mesh(
      boxGeo(T.w * 0.92, T.h * 0.98, T.l * 0.92), proxyMat
    );
    proxyTurret.position.y = T.h * 0.5;
    proxyTurret.userData = { tank: this, part: 'turret' };
    turretGroup.add(proxyTurret);

    this.proxyHull = proxyHull;
    this.proxyTurret = proxyTurret;
    this.hitMeshes = [proxyHull, proxyTurret];
    world.hitMeshes.push(proxyHull, proxyTurret);

    root.position.copy(this.pos);
    scene.add(root);
  }

  /* ==========================================================
     更新
     ========================================================== */
  update(dt) {
    if (!this.alive) return;

    this.prevPos.copy(this.pos);
    this.updateMovement(dt);
    this.updateTurret(dt);

    if (this.reloadTime > 0) this.reloadTime = Math.max(0, this.reloadTime - dt);

    const idt = dt > 1e-5 ? 1/dt : 0;
    this.velVec.set((this.pos.x - this.prevPos.x)*idt, 0,
                    (this.pos.z - this.prevPos.z)*idt);

    this.root.position.copy(this.pos);
    this.root.rotation.set(this.pitch, this.visualYaw, this.roll + this.leanRoll, 'YXZ');

    /* --- 车轮旋转 --- */
    const spin = this.speed / Math.max(this.radius * 0.55, 0.5) * dt;
    this.wheelSpin += spin;
    for (const w of this.wheelMeshes) {
      w.rotation.x = this.wheelSpin;
      if (w.userData.spoke) {
        w.userData.spoke.position.copy(w.position);
        w.userData.spoke.rotation.set(this.wheelSpin, 0, 0);
      }
      if (w.userData.ring) {
        w.userData.ring.position.copy(w.position);
        w.userData.ring.rotation.set(this.wheelSpin, Math.PI/2, 0);
      }
    }

    /* --- 受损冒烟 --- */
    if (this.hp / this.maxHp < 0.45) {
      this._smokeTimer -= dt;
      const severity = 1 - this.hp / this.maxHp;
      const interval = 0.35 - severity * 0.25;
      if (this._smokeTimer <= 0) {
        this._smokeTimer = interval * rand(0.7, 1.4);
        const px = this.pos.x + rand(-0.7, 0.7);
        const pz = this.pos.z + rand(-0.7, 0.7);
        const py = this.pos.y + this.bp.hull.h * 1.1;
        smokePool.emit({
          x:px, y:py, z:pz,
          vx: rand(-0.8,0.8), vy: rand(1.6, 3.2), vz: rand(-0.8,0.8),
          r: severity > 0.7 ? 0.18 : 0.30,
          g: severity > 0.7 ? 0.18 : 0.30,
          b: severity > 0.7 ? 0.18 : 0.30,
          size: rand(0.9, 1.8) * (0.6 + severity),
          life: rand(1.2, 2.2),
          drag: 0.6, gravity: -0.6, growth: 2.6
        });
      }
    }
  }

  updateMovement(dt) {
    const bp = this.bp;

    const engineF = this.modules.engine ? 1 : 0.42;
    const driverF = this.modules.driver ? 1 : 0.72;
    const crewF   = 0.72 + 0.28*(this.crew / bp.crew);
    const speedMul = this.isPlayer ? cheats.speedMul : 1;

    const maxSpeed = bp.maxSpeed * engineF * driverF * crewF * speedMul;
    const accel    = bp.accel    * engineF * driverF * crewF * speedMul;

    const hw = bp.hull.w * 0.55;
    const hl = bp.hull.l * 0.52;
    const cy = Math.cos(this.yaw), sy = Math.sin(this.yaw);

    const sample = (ox, oz) =>
      terrainHeight(this.pos.x + ox*cy + oz*sy,
                    this.pos.z - ox*sy + oz*cy);

    const hFL = sample(-hw,  hl);
    const hFR = sample( hw,  hl);
    const hBL = sample(-hw, -hl);
    const hBR = sample( hw, -hl);

    const avgY       = (hFL + hFR + hBL + hBR) * 0.25;
    const slopeFwd   = ((hFL + hFR) - (hBL + hBR)) / (4*hl);
    const slopeRight = ((hFR + hBR) - (hFL + hBL)) / (4*hw);

    const revMul = this.forwardInput < 0 ? 0.55 : 1;
    const targetSpeed = this.forwardInput * maxSpeed * revMul;

    const delta = targetSpeed - this.speed;
    const maxA = accel * (this.forwardInput !== 0 ? 1.7 : 2.6);
    this.speed += clamp(delta, -maxA*dt, maxA*dt);

    const dragF = (cheats.noTerrainDrag && this.isPlayer) ? 0 : 1;
    this.speed += (-9.8 * clamp(slopeFwd, -1, 1) * 0.55 * dragF) * dt;

    if (Math.abs(this.forwardInput) < 0.01) {
      this.speed *= Math.max(0, 1 - 2.4*dt);
    }
    this.speed *= Math.max(0, 1 - 0.22*dt);

    const absSlope = Math.abs(slopeFwd);
    if (absSlope > bp.climb) {
      this.speed *= Math.max(0.12, 1 - (absSlope - bp.climb) * 3.5);
    }

    this.speed = clamp(this.speed, -maxSpeed*0.7, maxSpeed*1.25);
    if (Math.abs(this.speed) < 0.02) this.speed = 0;

    const spdRatio = Math.min(1, Math.abs(this.speed) / Math.max(maxSpeed, 0.1));
    const turnRate = bp.turnRate * driverF * crewF * (0.42 + 0.58*spdRatio);
    const dirSign = this.speed < -0.2 ? -1 : 1;
    this.yaw += this.turnInput * turnRate * dt * dirSign;

    this.pos.x += Math.sin(this.yaw) * this.speed * dt;
    this.pos.z += Math.cos(this.yaw) * this.speed * dt;

    for (const ob of obstacles) {
      const dx = this.pos.x - ob.x, dz = this.pos.z - ob.z;
      const d2 = dx*dx + dz*dz;
      const minD = ob.r + this.radius;
      if (d2 < minD*minD && d2 > 1e-6) {
        const d = Math.sqrt(d2);
        const push = minD - d;
        this.pos.x += (dx/d) * push;
        this.pos.z += (dz/d) * push;
        this.speed *= 0.55;
      }
    }

    const dc = Math.hypot(this.pos.x, this.pos.z);
    if (dc > BOUND) {
      const k = BOUND / dc;
      this.pos.x *= k; this.pos.z *= k;
      this.speed *= 0.4;
    }

    const dy = avgY - this.pos.y;
    this.yVel += dy * 95 * dt;
    this.yVel *= Math.pow(0.015, dt);
    this.pos.y += this.yVel * dt;

    const minY = avgY - 0.35;
    if (this.pos.y < minY) { this.pos.y = minY; this.yVel = 0; }

    // 车体姿态
    const targetPitch = clamp(-Math.atan(slopeFwd), -0.30, 0.30);
    const targetRoll  = clamp( Math.atan(slopeRight), -0.24, 0.24);

    const k = 1 - Math.exp(-9*dt);
    this.pitch = lerp(this.pitch, targetPitch, k);
    this.roll  = lerp(this.roll,  targetRoll,  k);

    const targetLean = clamp(-this.turnInput * spdRatio * 0.045, -0.055, 0.055);
    this.leanRoll = lerp(this.leanRoll, targetLean, 1 - Math.exp(-6*dt));

    this.visualYaw = approachAngle(this.visualYaw, this.yaw, 12*dt);
  }

  updateTurret(dt) {
    const bp = this.bp;
    const ringF = this.modules.turretRing ? 1 : 0.30;
    const crewF = 0.65 + 0.35*(this.crew / bp.crew);
    const tSpeed = bp.turretSpeed * ringF * crewF;

    const desiredLocal = normAngle(this.desiredTurretWorldYaw - this.yaw);
    this.turretYaw = approachAngle(this.turretYaw, desiredLocal, tSpeed*dt);
    this.turretGroup.rotation.y = this.turretYaw;

    const gSpeed = bp.gunSpeed * crewF;
    const dp = clamp(this.desiredGunPitch - this.gunPitch, -gSpeed*dt, gSpeed*dt);
    this.gunPitch = clamp(this.gunPitch + dp, -8*DEG, 22*DEG);
    this.gunPivot.rotation.x = -this.gunPitch;
  }

  /* ==========================================================
     开火
     ========================================================== */
  fire(aimPoint) {
    if (!this.alive) return false;
    const isCheat = this.isPlayer && cheats.reload;
    if (this.reloadTime > 0 && !isCheat) return false;

    const sid = this.currentShell;
    const infAmmo = this.isPlayer && cheats.ammo;
    if (!infAmmo && (!this.ammo[sid] || this.ammo[sid] <= 0)) return false;
    if (!infAmmo) this.ammo[sid]--;

    this.root.updateMatrixWorld(true);
    const muzzlePos = new THREE.Vector3();
    this.muzzle.getWorldPosition(muzzlePos);

    const dir = new THREE.Vector3();

    /* ★ 弹道修正：优先朝准星指向的世界坐标点开火 */
    if (aimPoint) {
      dir.subVectors(aimPoint, muzzlePos);
      if (dir.lengthSq() < 1e-6) {
        this.muzzle.getWorldDirection(dir);
      } else {
        dir.normalize();
      }
    } else {
      this.muzzle.getWorldDirection(dir);
    }

    world.projectiles.push(new Projectile(this, muzzlePos, dir, SHELLS[sid]));

    /* --- 炮口焰 & 烟 --- */
    const big = this.bp.gunLen > 4.2;
    const flashScale = big ? 1.35 : 1.0;
    const fwd = dir.clone();

    for (let i = 0; i < Math.round(16 * flashScale); i++) {
      const d = randDir(_rd).multiplyScalar(rand(0.35, 1.0));
      d.addScaledVector(fwd, rand(0.4, 2.2));
      const sp = rand(9, 30) * flashScale;
      firePool.emit({
        x: muzzlePos.x, y: muzzlePos.y, z: muzzlePos.z,
        vx: d.x*sp, vy: d.y*sp, vz: d.z*sp,
        r: PAL.fireHot[0], g: PAL.fireHot[1], b: PAL.fireHot[2],
        size: rand(0.6, 1.7) * flashScale,
        life: rand(0.10, 0.22),
        drag: 6.0, gravity: 1.0, growth: 4.0
      });
    }
    for (let i = 0; i < Math.round(10 * flashScale); i++) {
      const d = randDir(_rd).multiplyScalar(rand(0.3, 0.9));
      d.addScaledVector(fwd, rand(0.3, 1.4));
      smokePool.emit({
        x: muzzlePos.x, y: muzzlePos.y, z: muzzlePos.z,
        vx: d.x*rand(3, 10), vy: d.y*rand(3, 10)+1.2, vz: d.z*rand(3, 10),
        r: PAL.smoke[0], g: PAL.smoke[1], b: PAL.smoke[2],
        size: rand(0.8, 2.2) * flashScale,
        life: rand(0.55, 1.30),
        drag: 1.6, gravity: -1.6, growth: 3.2
      });
    }

    /* --- 音效 --- */
    Audio2.playShot(muzzlePos, big);

    if (isCheat) {
      this.reloadTime = 0;
    } else {
      const gunF  = this.modules.gun ? 1 : 1.85;
      const crewF = 1 + (this.bp.crew - this.crew)*0.13;
      this.reloadTime = this.bp.reload * gunF * crewF;
    }

    if (this.isPlayer) cameraRecoil = 0.55;
    return true;
  }

  applyDamage(amount, source) {
    if (!this.alive) return;
    if (this.isPlayer && cheats.god) return;
    this.hp -= amount;
    if (this.hp <= 0) { this.hp = 0; this.destroy(source); }
  }

  destroy(source) {
    if (!this.alive) return;
    this.alive = false;
    this.speed = 0;

    for (const m of this.hitMeshes) {
      const i = world.hitMeshes.indexOf(m);
      if (i >= 0) world.hitMeshes.splice(i, 1);
    }

    this.root.traverse(o => {
      if (o.isMesh && o.material && o.material.visible !== false) {
        if (!o.material.__cloned) {
          o.material = o.material.clone();
          o.material.__cloned = true;
        }
        o.material.color.multiplyScalar(0.24);
      }
    });

    spawnExplosion(this.pos.clone().setY(this.pos.y + 1.4), 1.6, true);

    if (this.engineVoice) { this.engineVoice.stop(); this.engineVoice = null; }

    const name = source ? source.bp.name : '???';
    log(`${name} 击毁了 ${this.bp.name}`, this.team === 0 ? 'bad' : 'good');
    checkBattleEnd();
  }
}

/* ============================================================
   13. 飞机
   ============================================================ */
class Aircraft {
  constructor(bpId, team, isPlayer = false) {
    this.uid = TANK_UID++;
    this.bp = AIRCRAFT_BLUEPRINTS[bpId];
    this.bpId = bpId;
    this.kind = 'air';
    this.team = team;
    this.isPlayer = isPlayer;

    this.maxHp = this.bp.hp;
    this.hp = this.maxHp;
    this.crew = 1;
    this.alive = true;

    this.pos = new THREE.Vector3();
    this.prevPos = new THREE.Vector3();
    this.velVec = new THREE.Vector3();

    this.yaw = 0;
    this.pitch = 0;
    this.roll = 0;
    this.speed = this.bp.minSpeed;
    this.throttle = 0.7;

    this.desiredYaw = 0;
    this.desiredPitch = 0;

    this.gunTimer = 0;
    this.bombCount = this.bp.bombs;

    this.modules = { engine:true, turretRing:true, gun:true, driver:true };
    this.radius = Math.max(this.bp.size.w, this.bp.size.l) * 0.3;
    this.engineVoice = null;

    this.buildMesh();
  }

  buildMesh() {
    const bp = this.bp;
    const s = bp.size;
    const root = new THREE.Group();
    this.root = root;

    const colBase = new THREE.Color(bp.color);
    const bodyMat  = new THREE.MeshLambertMaterial({ color: bp.color });
    const wingMat  = new THREE.MeshLambertMaterial({ color: colBase.clone().multiplyScalar(0.92) });
    const darkMat  = new THREE.MeshLambertMaterial({ color: 0x2a2a2a });
    const metalMat = new THREE.MeshLambertMaterial({ color: 0x555555 });
    const glassMat = new THREE.MeshLambertMaterial({
      color:0x88bbdd, transparent:true, opacity:0.55
    });

    const noRay = o => { o.raycast = () => {}; return o; };

    // 机身
    const bodyGeo = new THREE.CylinderGeometry(s.w*0.26, s.w*0.20, s.l, 10);
    bodyGeo.rotateX(Math.PI/2);
    const body = new THREE.Mesh(bodyGeo, bodyMat);
    body.castShadow = true;
    body.userData = { tank:this, part:'hull' };
    root.add(body);
    this.bodyMesh = body;

    // 主翼
    const wing = new THREE.Mesh(
      new THREE.BoxGeometry(s.w*3.3, 0.16, s.l*0.23), wingMat
    );
    wing.position.set(0, -0.08, s.l*0.05);
    wing.castShadow = true;
    wing.userData = { tank:this, part:'hull' };
    root.add(wing);

    // 机翼上反角小翼尖
    for (const sx of [-1, 1]) {
      const tip = new THREE.Mesh(
        new THREE.BoxGeometry(s.w*0.5, 0.12, s.l*0.10), wingMat
      );
      tip.position.set(sx*s.w*1.55, 0.02, s.l*0.05);
      noRay(tip);
      root.add(tip);
    }

    // 平尾
    const tailH = new THREE.Mesh(
      new THREE.BoxGeometry(s.w*1.35, 0.13, s.l*0.17), wingMat
    );
    tailH.position.set(0, 0.08, -s.l*0.42);
    tailH.castShadow = true;
    tailH.userData = { tank:this, part:'hull' };
    root.add(tailH);

    // 垂尾
    const tailV = new THREE.Mesh(
      new THREE.BoxGeometry(0.13, s.h*1.7, s.l*0.17), wingMat
    );
    tailV.position.set(0, s.h*0.85, -s.l*0.42);
    tailV.castShadow = true;
    tailV.userData = { tank:this, part:'hull' };
    root.add(tailV);

    // 座舱
    const canopy = new THREE.Mesh(
      new THREE.SphereGeometry(s.w*0.22, 10, 7, 0, Math.PI*2, 0, Math.PI/2),
      glassMat
    );
    canopy.position.set(0, s.h*0.22, s.l*0.10);
    canopy.scale.set(1, 0.85, 2.4);
    noRay(canopy);
    root.add(canopy);

    // 螺旋桨
    const prop = new THREE.Mesh(
      new THREE.BoxGeometry(0.09, s.w*1.5, 0.04), darkMat
    );
    prop.position.z = s.l*0.51;
    noRay(prop);
    root.add(prop);
    this.propeller = prop;

    // 桨毂
    const nose = new THREE.Mesh(
      new THREE.CylinderGeometry(s.w*0.28, s.w*0.28, 0.5, 10), metalMat
    );
    nose.rotation.x = Math.PI/2;
    nose.position.z = s.l*0.48;
    noRay(nose);
    root.add(nose);

    // 引擎短舱（双发）
    for (const sx of [-1, 1]) {
      const nac = new THREE.Mesh(
        new THREE.CylinderGeometry(s.w*0.16, s.w*0.16, s.l*0.42, 8), metalMat
      );
      nac.rotation.x = Math.PI/2;
      nac.position.set(sx*s.w*0.85, -0.02, s.l*0.05);
      noRay(nac);
      root.add(nac);
    }

    this.hitMeshes = [body, wing, tailH, tailV];
    for (const m of this.hitMeshes) world.hitMeshes.push(m);

    scene.add(root);
  }

  update(dt) {
    if (!this.alive) return;

    this.prevPos.copy(this.pos);
    const bp = this.bp;

    const wantYaw = this.desiredYaw;
    const wantPitch = clamp(this.desiredPitch, -0.55, 0.5);

    const yawRate = bp.turnRate * (0.55 + 0.45*clamp(this.speed/bp.maxSpeed, 0, 1));
    const yawDelta = normAngle(wantYaw - this.yaw);
    const yawStep = clamp(yawDelta, -yawRate*dt, yawRate*dt);
    this.yaw += yawStep;

    const pitchDelta = wantPitch - this.pitch;
    const pitchStep = clamp(pitchDelta, -bp.pitchRate*dt, bp.pitchRate*dt);
    this.pitch += pitchStep;

    const yawRateNow = yawStep / Math.max(dt, 0.0001);
    const targetRoll = clamp(yawRateNow / Math.max(yawRate, 0.0001) * 0.95, -1.0, 1.0);
    this.roll = lerp(this.roll, targetRoll, 1 - Math.exp(-7*dt));

    const throttleAccel = this.throttle * bp.accel;
    const gravityEffect = -Math.sin(this.pitch) * 26;
    this.speed += (throttleAccel + gravityEffect) * dt;
    this.speed *= Math.pow(0.92, dt);
    this.speed = clamp(this.speed, bp.minSpeed, bp.maxSpeed * 1.2);

    const cp = Math.cos(this.pitch);
    const forward = new THREE.Vector3(
      Math.sin(this.yaw)*cp, Math.sin(this.pitch), Math.cos(this.yaw)*cp
    );

    this.pos.addScaledVector(forward, this.speed * dt);

    const th = terrainHeight(this.pos.x, this.pos.z);
    if (this.pos.y < th + 2.5) {
      this.pos.y = th + 2.5;
      if (this.speed > 25) {
        this.applyDamage(this.maxHp * 0.75, null);
        spawnExplosion(this.pos.clone(), 1.2, false);
      }
      this.pitch = Math.max(this.pitch, 0.15);
    }

    const dc = Math.hypot(this.pos.x, this.pos.z);
    if (dc > BOUND * 1.25) {
      const toCenter = Math.atan2(-this.pos.x, -this.pos.z);
      this.yaw = approachAngle(this.yaw, toCenter, 1.4*dt);
      this.desiredYaw = this.yaw;
    }

    if (this.propeller) this.propeller.rotation.z += dt * 42;
    if (this.gunTimer > 0) this.gunTimer -= dt;

    // 加力尾焰
    if (this.throttle > 1.02) {
      const back = forward.clone().multiplyScalar(-s.l*0.5);
      const p = this.pos.clone().add(back);
      for (let i = 0; i < 2; i++) {
        firePool.emit({
          x: p.x + rand(-0.3,0.3), y: p.y, z: p.z + rand(-0.3,0.3),
          vx: -forward.x*rand(6,18), vy: -forward.y*rand(6,18) - 1, vz: -forward.z*rand(6,18),
          r: 1.0, g: 0.65, b: 0.28,
          size: rand(0.3, 0.9), life: rand(0.10, 0.24),
          drag: 5, gravity: -1, growth: 2.4
        });
      }
    }

    const idt = dt > 1e-5 ? 1/dt : 0;
    this.velVec.set((this.pos.x - this.prevPos.x)*idt, 0,
                    (this.pos.z - this.prevPos.z)*idt);

    this.root.position.copy(this.pos);
    this.root.rotation.set(-this.pitch, this.yaw, this.roll, 'YXZ');
  }

  fireGun() {
    if (!this.alive || this.gunTimer > 0) return false;
    this.gunTimer = this.bp.fireRate;

    const bp = this.bp;
    const cp = Math.cos(this.pitch);
    const forward = new THREE.Vector3(
      Math.sin(this.yaw)*cp, Math.sin(this.pitch), Math.cos(this.yaw)*cp
    );
    const right = new THREE.Vector3(Math.cos(this.yaw), 0, -Math.sin(this.yaw));
    const up = new THREE.Vector3(0, 1, 0).applyEuler(
      new THREE.Euler(-this.pitch, this.yaw, this.roll, 'YXZ')
    );

    for (const side of [-1, 1]) {
      const origin = this.pos.clone()
        .addScaledVector(right, side * bp.size.w * 1.15)
        .addScaledVector(forward, bp.size.l * 0.28)
        .addScaledVector(up, -0.06);

      const dir = forward.clone();
      const sp = bp.gunSpread;
      dir.x += rand(-sp, sp);
      dir.y += rand(-sp, sp);
      dir.z += rand(-sp, sp);
      dir.normalize();

      const def = { ...SHELLS.MG, vel: bp.gunSpeed, dmg: bp.gunDmg };
      world.projectiles.push(new Projectile(this, origin, dir, def));
    }

    const muzzle = this.pos.clone().addScaledVector(forward, bp.size.l * 0.5);
    for (let i = 0; i < 4; i++) {
      firePool.emit({
        x: muzzle.x, y: muzzle.y, z: muzzle.z,
        vx: forward.x*rand(6,16), vy: forward.y*rand(6,16), vz: forward.z*rand(6,16),
        r: 1.0, g: 0.9, b: 0.5,
        size: rand(0.25, 0.7), life: rand(0.05, 0.12),
        drag: 8, gravity: 0, growth: 2.5
      });
    }

    Audio2.playMG(this.pos);

    if (this.isPlayer) cameraRecoil = 0.12;
    return true;
  }

  dropBomb() {
    if (!this.alive || this.kind !== 'air') return false;
    if (this.bombCount <= 0) return false;
    this.bombCount--;

    const bp = this.bp;
    const cp = Math.cos(this.pitch);
    const forward = new THREE.Vector3(
      Math.sin(this.yaw)*cp, Math.sin(this.pitch), Math.cos(this.yaw)*cp
    );

    const origin = this.pos.clone()
      .addScaledVector(forward, -bp.size.l * 0.05)
      .add(new THREE.Vector3(0, -bp.size.h * 0.6, 0));

    const vel = forward.clone().multiplyScalar(this.speed);
    vel.y -= 2;

    world.bombs.push(new Bomb(this, origin, vel));
    log(`投弹！剩余 ${this.bombCount} 枚`, 'info');
    return true;
  }

  applyDamage(amount, source) {
    if (!this.alive) return;
    if (this.isPlayer && cheats.god) return;
    this.hp -= amount;
    if (this.hp <= 0) { this.hp = 0; this.destroy(source); }
  }

  destroy(source) {
    if (!this.alive) return;
    this.alive = false;

    for (const m of this.hitMeshes) {
      const i = world.hitMeshes.indexOf(m);
      if (i >= 0) world.hitMeshes.splice(i, 1);
    }

    spawnExplosion(this.pos.clone(), 1.9, true);

    if (this.engineVoice) { this.engineVoice.stop(); this.engineVoice = null; }

    scene.remove(this.root);

    const name = source ? (source.bp?.name || '???') : '地面';
    log(`${name} 击落了 ${this.bp.name}`, this.team === 0 ? 'bad' : 'good');
    checkBattleEnd();
  }
}

/* ============================================================
   14. 炮弹
   ============================================================ */
class Projectile {
  constructor(owner, origin, dir, shellDef) {
    this.owner = owner;
    this.shellDef = shellDef;
    this.pos = origin.clone();
    this.dir = dir.clone().normalize();
    this.speed = shellDef.vel;
    this.traveled = 0;
    this.alive = true;
    this.ray = new THREE.Raycaster();

    const size = shellDef.mg ? 0.07 : 0.17;
    const geo = new THREE.SphereGeometry(size, 5, 4);
    const mat = new THREE.MeshBasicMaterial({ color: shellDef.color });
    this.mesh = new THREE.Mesh(geo, mat);
    this.mesh.position.copy(this.pos);
    scene.add(this.mesh);

    // 曳光（非机枪）
    this.trailTimer = 0;
  }

  update(dt) {
    if (!this.alive) return;

    const SUB = this.shellDef.mg ? 2 : 4;
    const subDt = dt / SUB;

    for (let s = 0; s < SUB && this.alive; s++) {
      const step = this.speed * subDt;
      const next = this.pos.clone().addScaledVector(this.dir, step);

      const th = terrainHeight(next.x, next.z);
      if (next.y <= th + 0.15) {
        const hp = next.clone(); hp.y = th + 0.15;
        this.explodeTerrain(hp);
        return;
      }

      this.ray.set(this.pos, this.dir);
      this.ray.near = 0;
      this.ray.far = step;

      const hits = this.ray.intersectObjects(world.hitMeshes, false);
      let hit = null;
      for (const h of hits) {
        if (h.object.userData.tank === this.owner) continue;
        hit = h; break;
      }

      if (hit) { this.onHit(hit); return; }

      this.pos.copy(next);
      this.mesh.position.copy(this.pos);
      this.traveled += step;

      if (this.traveled > 2400) { this.kill(); return; }
    }

    // 曳光粒子
    this.trailTimer -= dt;
    if (this.trailTimer <= 0 && !this.shellDef.mg) {
      this.trailTimer = 0.018;
      const c = this.shellDef.color;
      const col = new THREE.Color(c);
      firePool.emit({
        x: this.pos.x, y: this.pos.y, z: this.pos.z,
        vx: rand(-0.4,0.4), vy: rand(-0.2,0.4), vz: rand(-0.4,0.4),
        r: col.r, g: col.g, b: col.b,
        size: rand(0.14, 0.28), life: rand(0.08, 0.18),
        drag: 3, gravity: 0, growth: -0.4
      });
    }
  }

  kill() {
    this.alive = false;
    scene.remove(this.mesh);
    this.mesh.geometry.dispose();
    this.mesh.material.dispose();
  }

  explodeTerrain(point) {
    const sd = this.shellDef;
    if (sd.mg) {
      spawnImpactDust(point, 0.25, PAL.dust);
      Audio2.playImpact(point, false);
      this.kill();
      return;
    }

    spawnExplosion(point, sd.explosive ? 0.85 : 0.55, false);

    if (sd.splash) {
      for (const t of world.vehicles) {
        if (!t.alive || t === this.owner) continue;
        const d = t.pos.distanceTo(point);
        if (d < sd.splash + 3) {
          const dmg = sd.dmg * 0.4 * (1 - d/(sd.splash + 3));
          t.applyDamage(dmg * (this.owner?.bp.dmgMod || 1), this.owner);
        }
      }
    }
    this.kill();
  }

  onHit(hit) {
    const obj = hit.object;

    if (!obj.userData.tank) {
      spawnExplosion(hit.point, 0.55, false);
      Audio2.playImpact(hit.point, false);
      this.kill();
      return;
    }

    const target = obj.userData.tank;
    if (!target || !target.alive) { this.kill(); return; }

    resolveHit(this.owner, target, hit, this.shellDef, this.traveled, this.dir);
    this.kill();
  }
}

/* ============================================================
   15. 炸弹
   ============================================================ */
class Bomb {
  constructor(owner, origin, velocity) {
    this.owner = owner;
    this.pos = origin.clone();
    this.vel = velocity.clone();
    this.alive = true;
    this.life = 14;

    const geo = new THREE.SphereGeometry(0.32, 8, 6);
    const mat = new THREE.MeshLambertMaterial({ color: 0x3a3a30 });
    this.mesh = new THREE.Mesh(geo, mat);
    this.mesh.castShadow = true;
    this.mesh.position.copy(this.pos);
    scene.add(this.mesh);
  }

  update(dt) {
    if (!this.alive) return;
    this.life -= dt;
    if (this.life <= 0) { this.kill(); return; }

    this.vel.y -= 24 * dt;
    this.vel.multiplyScalar(Math.pow(0.992, dt*60));

    const step = this.vel.length() * dt;
    if (step < 1e-5) return;
    const dir = this.vel.clone().normalize();

    const next = this.pos.clone().addScaledVector(this.vel, dt);

    const th = terrainHeight(next.x, next.z);
    if (next.y <= th + 0.35) {
      this.explode(next.clone().setY(th + 0.35));
      return;
    }

    const ray = new THREE.Raycaster(this.pos, dir, 0, step);
    const hits = ray.intersectObjects(world.hitMeshes, false);
    if (hits.length) { this.explode(hits[0].point); return; }

    this.pos.copy(next);
    this.mesh.position.copy(this.pos);
    this.mesh.rotation.x += dt * 3.5;
    this.mesh.rotation.z += dt * 1.2;
  }

  explode(point) {
    this.alive = false;
    scene.remove(this.mesh);
    this.mesh.geometry.dispose();
    this.mesh.material.dispose();

    spawnExplosion(point, 2.6, true);
    Audio2.playExplosion(point, 1.8);

    const RADIUS = 17;
    const DMG = 280;
    for (const t of world.vehicles) {
      if (!t.alive || t === this.owner) continue;
      const d = t.pos.distanceTo(point);
      if (d < RADIUS) {
        const fall = 1 - d/RADIUS;
        let dmg = DMG * fall * fall * 1.8;
        if (this.owner?.isPlayer && cheats.oneShot) dmg *= 40;
        t.applyDamage(dmg, this.owner);
      }
    }
  }

  kill() {
    this.alive = false;
    scene.remove(this.mesh);
    this.mesh.geometry.dispose();
    this.mesh.material.dispose();
  }
}

/* ============================================================
   16. 命中结算
   ============================================================ */
function resolveHit(attacker, target, hit, shellDef, distance, shellDir) {

  if (target.kind === 'air') {
    let dmg = shellDef.dmg * (attacker?.bp.dmgMod || 1);
    if (shellDef.explosive) dmg *= 1.5;
    if (attacker?.isPlayer && cheats.oneShot) dmg *= 60;
    dmg *= rand(0.85, 1.15);

    spawnExplosion(hit.point, 0.55, false);
    Audio2.playImpact(hit.point, true);

    if (target.isPlayer) log(`机体中弹 -${Math.round(dmg)}`, 'bad');
    else if (attacker?.isPlayer) log(`命中敌机 -${Math.round(dmg)}`, 'good');
    target.applyDamage(dmg, attacker);
    return;
  }

  const obj = hit.object;
  const part = obj.userData.part || 'hull';

  const nMat = new THREE.Matrix3().getNormalMatrix(obj.matrixWorld);
  const worldNormal = hit.face.normal.clone().applyMatrix3(nMat).normalize();

  const partQuat = new THREE.Quaternion();
  obj.getWorldQuaternion(partQuat);
  const invQuat = partQuat.clone().invert();

  const localNormal = worldNormal.clone().applyQuaternion(invQuat).normalize();
  const localDir    = shellDir.clone().applyQuaternion(invQuat).normalize();

  const ax = Math.abs(localNormal.x), ay = Math.abs(localNormal.y), az = Math.abs(localNormal.z);
  let faceName;
  if (ay > 0.70)      faceName = 'top';
  else if (az >= ax)  faceName = localNormal.z > 0 ? 'front' : 'rear';
  else                faceName = 'side';

  const armorSet = target.bp.armor[part];
  const slopeSet = target.bp.slope[part];
  const baseThickness = armorSet[faceName];
  const slopeAngle = (slopeSet[faceName] || 0) * DEG;

  const s = Math.sin(slopeAngle), c = Math.cos(slopeAngle);
  let tiltedNormal;
  switch (faceName) {
    case 'front': tiltedNormal = new THREE.Vector3(0, s, c); break;
    case 'rear':  tiltedNormal = new THREE.Vector3(0, s, -c); break;
    case 'side':  tiltedNormal = new THREE.Vector3(Math.sign(localNormal.x)*c, s, 0); break;
    default:      tiltedNormal = new THREE.Vector3(0, 1, 0);
  }
  tiltedNormal.normalize();

  const cosTheta = clamp(Math.abs(tiltedNormal.dot(localDir)), 0, 1);
  const theta = Math.acos(cosTheta);
  const thetaEff = Math.max(0, theta - shellDef.norm * DEG);

  const effective = baseThickness / Math.max(Math.cos(thetaEff), 0.06);

  const penMod = attacker ? attacker.bp.penMod : 1;
  const dmgMod = attacker ? attacker.bp.dmgMod : 1;
  const penAtRange = shellDef.pen * penMod * (1 - clamp(distance * shellDef.falloff, 0, 0.62));

  const ricochetLimit = shellDef.ricochet * DEG;
  const isRicochet = (thetaEff > ricochetLimit) && shellDef.id !== 'HE' && !shellDef.mg;

  const impactPoint = hit.point.clone();

  if (shellDef.mg) {
    const penRatio = penAtRange / Math.max(effective, 1);
    if (penRatio > 1.0) {
      let dmg = shellDef.dmg * dmgMod * 1.4 * rand(0.85, 1.15);
      if (attacker?.isPlayer && cheats.oneShot) dmg *= 60;
      spawnImpactDust(impactPoint, 0.35, PAL.spark);
      Audio2.playImpact(impactPoint, false);
      target.applyDamage(dmg, attacker);
      if (target.isPlayer) log(`被机枪击穿 -${Math.round(dmg)}`, 'bad');
    } else {
      spawnImpactDust(impactPoint, 0.22, PAL.spark);
      if (Math.random() < 0.35) {
        target.applyDamage(shellDef.dmg * dmgMod * 0.32, attacker);
      }
    }
    return;
  }

  if (isRicochet) {
    spawnRicochetSparks(impactPoint, worldNormal);
    Audio2.playRicochet(impactPoint);
    if (target.isPlayer) log('跳弹！', 'warn');
    else if (attacker?.isPlayer) log('跳弹 — 入射角过大', 'warn');
    return;
  }

  const penRatio = penAtRange / effective;

  if (penRatio <= 1.0) {
    spawnNonPenEffect(impactPoint, worldNormal);
    Audio2.playNonPen(impactPoint);

    let splashDmg = 0;
    if (shellDef.splash) {
      splashDmg = shellDef.dmg * 0.30 * (1 - thetaEff/(Math.PI/2)) * dmgMod;
    } else if (shellDef.explosive) {
      splashDmg = shellDef.dmg * 0.13 * dmgMod;
    }
    if (splashDmg > 0) {
      target.applyDamage(splashDmg, attacker);
      if (Math.random() < 0.16) {
        target.crew = Math.max(0, target.crew - 1);
        if (target.crew === 0) target.destroy(attacker);
      }
    }

    if (target.isPlayer) log(`未击穿！等效装甲 ${Math.round(effective)}mm`, 'warn');
    else if (attacker?.isPlayer) log(`未击穿 — 需 ${Math.round(effective)}mm 穿深`, 'warn');
    return;
  }

  spawnPenEffect(impactPoint, worldNormal);
  Audio2.playImpact(impactPoint, true);

  let damage = shellDef.dmg * dmgMod;
  if (penRatio > 1.6) damage *= 1.20;
  else if (penRatio > 1.25) damage *= 1.08;
  damage *= rand(0.88, 1.12);
  if (attacker?.isPlayer && cheats.oneShot) damage *= 60;

  const localHit = target.root.worldToLocal(impactPoint.clone());
  const mod = rollModule(target, part, localHit);

  if (mod === 'ammo') {
    if (Math.random() < 0.24) {
      damage = target.maxHp * 3;
      if (target.isPlayer) log('弹药架殉爆！', 'warn');
      else if (attacker?.isPlayer) log('弹药架殉爆！一击必杀', 'good');
      spawnExplosion(impactPoint, 1.8, true);
    } else {
      damage += target.maxHp * 0.18;
      target.modules.gun = false;
    }
  } else if (mod === 'engine') {
    target.modules.engine = false;
    damage *= 1.12;
    spawnSmokePlume(target.pos.clone().setY(target.pos.y + 1.1), 1.6);
  } else if (mod === 'turretRing') {
    target.modules.turretRing = false;
  } else if (mod === 'gun') {
    target.modules.gun = false;
    damage *= 0.85;
  } else if (mod === 'crew') {
    target.crew = Math.max(0, target.crew - 1);
  }

  if (attacker?.isPlayer) log(`击穿！${Math.round(effective)}mm · 伤害 ${Math.round(damage)}`, 'good');
  if (target.isPlayer) log(`被击穿！${Math.round(effective)}mm 装甲 · 损失 ${Math.round(damage)}`, 'bad');

  target.applyDamage(damage, attacker);
  if (target.alive && target.crew <= 0) target.destroy(attacker);
}

function rollModule(target, part, localHit) {
  const options = [];
  if (part === 'turret') {
    options.push(['gun',28], ['turretRing',26], ['crew',32], ['ammo',14]);
  } else {
    const l = target.bp.hull.l;
    if (localHit.z < -l*0.12)      options.push(['engine',46], ['crew',22], ['ammo',32]);
    else if (localHit.z > l*0.14)  options.push(['crew',34], ['ammo',38], ['gun',8], ['turretRing',20]);
    else                           options.push(['crew',42], ['ammo',34], ['turretRing',24]);
  }
  let total = 0;
  for (const [,w] of options) total += w;
  let r = Math.random()*total;
  for (const [n,w] of options) { r -= w; if (r <= 0) return n; }
  return 'crew';
}

/* ============================================================
   17. 特效生成器
   ============================================================ */

/* ---- 大爆炸 ---- */
function spawnExplosion(pos, scale = 1, big = false) {
  const s = clamp(scale, 0.2, 4);

  /* --- 火球 --- */
  const nFire = Math.round(20 * s + 8);
  for (let i = 0; i < nFire; i++) {
    const dir = randDir(_rd).clone();
    const sp = rand(3, 16) * (0.6 + s * 0.5);
    const hot = Math.random() < 0.6;
    const c = hot ? PAL.fireHot : PAL.fireMid;
    firePool.emit({
      x: pos.x + dir.x * s * 0.5,
      y: pos.y + dir.y * s * 0.5,
      z: pos.z + dir.z * s * 0.5,
      vx: dir.x * sp,
      vy: dir.y * sp + rand(1, 6) * s * 0.6,
      vz: dir.z * sp,
      r: c[0] * rand(0.85,1.1),
      g: c[1] * rand(0.85,1.1),
      b: c[2] * rand(0.85,1.1),
      size: rand(0.8, 2.4) * (0.6 + s * 0.55),
      life: rand(0.30, 0.80) * (0.7 + s * 0.35),
      drag: 2.2, gravity: 4.5, growth: 2.6
    });
  }

  /* --- 白热核心 --- */
  for (let i = 0; i < Math.round(6 * s + 3); i++) {
    const dir = randDir(_rd).clone();
    firePool.emit({
      x: pos.x, y: pos.y, z: pos.z,
      vx: dir.x * rand(1, 5),
      vy: dir.y * rand(1, 5) + 2,
      vz: dir.z * rand(1, 5),
      r: 1.0, g: 0.98, b: 0.88,
      size: rand(1.4, 3.2) * (0.6 + s * 0.5),
      life: rand(0.12, 0.26),
      drag: 4.5, gravity: 0, growth: 3.2
    });
  }

  /* --- 黑烟 --- */
  const nSmoke = Math.round(16 * s + 8);
  for (let i = 0; i < nSmoke; i++) {
    const dir = randDir(_rd).clone();
    const dark = Math.random() < 0.6;
    const c = dark ? PAL.smokeDark : PAL.smoke;
    smokePool.emit({
      x: pos.x + dir.x * s * 0.8,
      y: pos.y + dir.y * s * 0.8 + 0.4,
      z: pos.z + dir.z * s * 0.8,
      vx: dir.x * rand(1.5, 7) * (0.7 + s * 0.3),
      vy: rand(2.5, 7.5) * (0.6 + s * 0.4),
      vz: dir.z * rand(1.5, 7) * (0.7 + s * 0.3),
      r: c[0] * rand(0.8, 1.2),
      g: c[1] * rand(0.8, 1.2),
      b: c[2] * rand(0.8, 1.2),
      size: rand(1.2, 3.4) * (0.6 + s * 0.6),
      life: rand(1.1, 2.6) * (0.8 + s * 0.3),
      drag: 1.0, gravity: -1.6, growth: 3.4
    });
  }

  /* --- 火星 --- */
  const nSpark = Math.round(14 * s + 6);
  for (let i = 0; i < nSpark; i++) {
    const dir = randDir(_rd).clone();
    const sp = rand(10, 34) * (0.6 + s * 0.5);
    firePool.emit({
      x: pos.x, y: pos.y, z: pos.z,
      vx: dir.x * sp,
      vy: dir.y * sp + rand(3, 12),
      vz: dir.z * sp,
      r: PAL.spark[0], g: PAL.spark[1], b: PAL.spark[2],
      size: rand(0.14, 0.40),
      life: rand(0.35, 1.05),
      drag: 0.5, gravity: 22, growth: -0.5
    });
  }

  /* --- 地面尘土 --- */
  const th = terrainHeight(pos.x, pos.z);
  if (pos.y < th + 3.5) {
    for (let i = 0; i < Math.round(10 * s); i++) {
      const ang = Math.random() * Math.PI * 2;
      const r = rand(0.5, 2.5) * s;
      smokePool.emit({
        x: pos.x + Math.cos(ang) * r,
        y: th + 0.4,
        z: pos.z + Math.sin(ang) * r,
        vx: Math.cos(ang) * rand(4, 13) * s * 0.7,
        vy: rand(0.6, 3.0),
        vz: Math.sin(ang) * rand(4, 13) * s * 0.7,
        r: PAL.dust[0], g: PAL.dust[1], b: PAL.dust[2],
        size: rand(1.0, 2.6) * (0.6 + s * 0.5),
        life: rand(0.9, 2.1),
        drag: 1.6, gravity: -1.2, growth: 3.0
      });
    }
  }

  /* --- 音效 --- */
  Audio2.playExplosion(pos, s);
}

/* ============================================================
   18. AI
   ============================================================ */
class AIController {
  constructor(tank, skill = 1) {
    this.tank = tank;
    this.skill = skill;
    this.target = null;
    this.retargetTimer = rand(0, 0.7);
    this.state = 'advance';
    this.aimErrX = 0; this.aimErrY = 0;
    this.errTimer = 0;
    this.stuckTimer = 0;
    this.stuckTurn = 0;
    this.stuckDir = 1;
  }

  update(dt) {
    const t = this.tank;
    if (!t.alive) return;

    if (Math.abs(t.speed) < 0.5 && Math.abs(t.forwardInput) > 0.2) {
      this.stuckTimer += dt;
      if (this.stuckTimer > 1.6) {
        this.stuckTimer = 0;
        this.stuckTurn = 1.3;
        this.stuckDir = Math.random() < 0.5 ? 1 : -1;
      }
    } else this.stuckTimer = 0;

    if (this.stuckTurn > 0) {
      this.stuckTurn -= dt;
      t.turnInput = this.stuckDir;
      t.forwardInput = -0.75;
      t.desiredTurretWorldYaw = t.yaw + Math.PI;
      t.desiredGunPitch = 0;
      this.aimAndFire(dt, this.target, 999, true);
      return;
    }

    this.errTimer -= dt;
    this.retargetTimer -= dt;
    if (this.retargetTimer <= 0) {
      this.retargetTimer = rand(0.5, 0.95);
      this.target = this.pickTarget();
    }

    const tgt = this.target;

    if (!tgt || !tgt.alive) {
      const pushTarget = t.team === 1 ? PLAYER_BASE_POS : ENEMY_BASE_POS;
      this.driveTowards(pushTarget, dt, 0.85);
      t.desiredTurretWorldYaw = t.yaw + Math.sin(world.time*0.55)*1.5;
      t.desiredGunPitch = 0;
      return;
    }

    const dist = t.pos.distanceTo(tgt.pos);
    const hpRatio = t.hp / t.maxHp;
    const canPen = this.canPenetrate(tgt);
    const los = this.hasLOS(tgt);

    let ns;
    if (hpRatio < 0.28 && dist < 170 && !canPen) ns = 'retreat';
    else if (!canPen && tgt.team !== t.team)      ns = 'flank';
    else if (!los && dist > 120)                  ns = 'advance';
    else                                          ns = 'engage';

    this.state = ns;

    switch (this.state) {
      case 'engage':  this.behaviorEngage(dt, tgt, dist); break;
      case 'flank':   this.behaviorFlank(dt, tgt, dist);  break;
      case 'retreat': this.behaviorRetreat(dt, tgt, dist);break;
      default:        this.behaviorAdvance(dt, tgt, dist);break;
    }

    this.aimAndFire(dt, tgt, dist);
  }

  pickTarget() {
    const t = this.tank;
    let best = null, bestScore = -Infinity;
    for (const o of world.vehicles) {
      if (!o.alive || o.team === t.team) continue;
      const d = t.pos.distanceTo(o.pos);
      if (d > 480) continue;

      let score = -d * 0.010;
      score += (1 - o.hp/o.maxHp) * 2.4;
      if (this.canPenetrate(o)) score += 2.0;
      if (o.isPlayer) score += 0.9;
      if (o.kind === 'air') score -= 1.2;
      if (score > bestScore) { bestScore = score; best = o; }
    }
    return best;
  }

  canPenetrate(target) {
    const t = this.tank;
    const sh = SHELLS[t.currentShell];
    const pen = sh.pen * t.bp.penMod;
    const a = target.bp.armor.hull.front;
    const s = (target.bp.slope.hull.front || 0) * DEG;
    const eff = a / Math.max(Math.cos(s), 0.1);
    return pen >= eff * 1.02;
  }

  hasLOS(target) {
    const from = this.tank.pos.clone(); from.y += 2.2;
    const to   = target.pos.clone();    to.y   += 1.7;

    const steps = 18;
    for (let i = 1; i < steps; i++) {
      const p = from.clone().lerp(to, i/steps);
      if (p.y < terrainHeight(p.x, p.z)) return false;
    }
    const dir = to.clone().sub(from);
    const dist = dir.length();
    dir.normalize();
    const ray = new THREE.Raycaster(from, dir, 0, dist);
    return ray.intersectObjects(staticHitMeshes, false).length === 0;
  }

  driveTowards(point, dt, mul = 1, reverse = false) {
    const t = this.tank;
    const d = new THREE.Vector3().subVectors(point, t.pos);
    d.y = 0;
    const dist = d.length();
    if (dist < 2.5) { t.forwardInput = 0; t.turnInput = 0; return; }

    let wantYaw = Math.atan2(d.x, d.z);
    if (reverse) wantYaw = normAngle(wantYaw + Math.PI);

    const dy = normAngle(wantYaw - t.yaw);
    t.turnInput = clamp(dy * 2.6, -1, 1);

    if (Math.abs(dy) > 1.8) {
      t.forwardInput = 0.25 * mul;
    } else {
      const align = clamp(1 - Math.abs(dy)*0.42, 0.28, 1);
      t.forwardInput = (reverse ? -1 : 1) * align * mul;
    }
  }

  behaviorEngage(dt, tgt, dist) {
    const t = this.tank;
    const idealMin = 70, idealMax = 190;
    const dir = new THREE.Vector3().subVectors(tgt.pos, t.pos); dir.y = 0;
    const dN = dir.clone().normalize();
    const perp = new THREE.Vector3(-dN.z, 0, dN.x)
      .multiplyScalar(Math.sin(world.time*0.7 + t.uid) * 0.5);

    let goal;
    if (dist > idealMax) {
      goal = t.pos.clone().addScaledVector(dN, dist - idealMax + 10).add(perp);
      this.driveTowards(goal, dt, 1.0);
    } else if (dist < idealMin) {
      goal = t.pos.clone().addScaledVector(dN, -(idealMin - dist + 10)).add(perp);
      this.driveTowards(goal, dt, 0.85);
    } else {
      goal = t.pos.clone().add(perp).addScaledVector(dN, 8);
      this.driveTowards(goal, dt, 0.72);
    }
  }

  behaviorFlank(dt, tgt, dist) {
    const t = this.tank;
    const tF = new THREE.Vector3(Math.sin(tgt.yaw), 0, Math.cos(tgt.yaw));
    const tR = new THREE.Vector3(Math.cos(tgt.yaw), 0, -Math.sin(tgt.yaw));
    const toMe = new THREE.Vector3().subVectors(t.pos, tgt.pos).normalize();
    const side = toMe.dot(tR) >= 0 ? 1 : -1;

    const flankPt = tgt.pos.clone()
      .addScaledVector(tR, side*72)
      .addScaledVector(tF, -55);

    if (dist < 65) {
      const away = t.pos.clone().addScaledVector(
        new THREE.Vector3().subVectors(t.pos, tgt.pos).normalize(), 55);
      this.driveTowards(away, dt, 1.0);
    } else {
      this.driveTowards(flankPt, dt, 1.0);
    }
  }

  behaviorRetreat(dt, tgt, dist) {
    const t = this.tank;
    const away = new THREE.Vector3().subVectors(t.pos, tgt.pos).normalize();
    const baseDir = t.team === 1
      ? new THREE.Vector3(0, 0, 1)
      : new THREE.Vector3(0, 0, -1);

    const goal = t.pos.clone().addScaledVector(away, 60).addScaledVector(baseDir, 60);
    goal.x = clamp(goal.x, -BOUND+40, BOUND-40);
    goal.z = clamp(goal.z, -BOUND+40, BOUND-40);
    this.driveTowards(goal, dt, 1.0);
  }

  behaviorAdvance(dt, tgt, dist) {
    const t = this.tank;
    const dir = new THREE.Vector3().subVectors(tgt.pos, t.pos); dir.y = 0;
    const goal = t.pos.clone().addScaledVector(dir.normalize(), 55);
    this.driveTowards(goal, dt, 0.95);
  }

  aimAndFire(dt, tgt, dist, skipFire = false) {
    const t = this.tank;
    if (!tgt) return;

    if (this.errTimer <= 0) {
      this.errTimer = rand(0.3, 0.85);
      const e = (2.1 - this.skill)*0.028;
      this.aimErrX = rand(-e, e);
      this.aimErrY = rand(-e*0.6, e*0.6);
    }

    const sh = SHELLS[t.currentShell];
    const flight = dist / sh.vel;
    const predFactor = tgt.kind === 'air' ? 0.55 : 0.88;
    const pred = tgt.pos.clone().addScaledVector(tgt.velVec, flight * predFactor);
    const aimPt = pred.clone();
    aimPt.y += tgt.kind === 'air' ? 0.5 : 1.4;

    const dx = aimPt.x - t.pos.x, dz = aimPt.z - t.pos.z;
    const wantYaw = Math.atan2(dx, dz) + this.aimErrX * Math.min(dist, 300) * 0.018;
    t.desiredTurretWorldYaw = wantYaw;

    const dy = aimPt.y - (t.pos.y + 2.2);
    const horiz = Math.hypot(dx, dz);
    /* ★ 弹道为直线飞行，不做重力补偿 */
    t.desiredGunPitch = clamp(Math.atan2(dy, horiz) + this.aimErrY, -8*DEG, 20*DEG);

    if (skipFire) return;
    if (t.reloadTime > 0) return;

    const yawErr = Math.abs(normAngle(t.yaw + t.turretYaw - wantYaw));
    const pitchErr = Math.abs(t.gunPitch - t.desiredGunPitch);
    const tol = 0.024 / Math.max(this.skill, 0.5);

    if (yawErr < tol && pitchErr < 0.022) {
      const hitChance = clamp(1.05 - dist/620, 0.4, 0.97) * (0.7 + 0.3*this.skill);
      if (Math.random() < hitChance) t.fire();
      else {
        t.desiredTurretWorldYaw += rand(-0.022, 0.022);
        t.desiredGunPitch += rand(-0.014, 0.014);
      }
    }
  }
}

let playerVehicle = null;
const aiControllers = [];
let gameOver = false;
let cameraRecoil = 0;

/* ============================================================
   20. 辅助瞄准
   ============================================================ */
const ASSIST_RANGE      = 220;
const ASSIST_YAW_CONE   = 7.5 * DEG;
const ASSIST_PITCH_CONE = 5.5 * DEG;
const YAW_LIMIT         = 175 * DEG;

let assistLocked = false;
let aimReady = false;

function hasSimpleLOS(from, to) {
  const steps = 12;
  for (let i = 1; i < steps; i++) {
    const p = from.clone().lerp(to, i/steps);
    if (p.y < terrainHeight(p.x, p.z)) return false;
  }
  return true;
}

function computeAimSolution(t, target) {
  const shell = SHELLS[t.currentShell];
  if (!shell) return null;

  const muzzle = t.pos.clone();
  muzzle.y += 2.0;

  const aimPt = target.pos.clone();
  aimPt.y += (target.kind === 'air' ? 0.5 : 1.2);

  let flight = 0;
  for (let i = 0; i < 3; i++) {
    const p = aimPt.clone().addScaledVector(target.velVec, flight);
    const d = p.distanceTo(muzzle);
    flight = d / shell.vel;
  }

  const finalPt = aimPt.clone().addScaledVector(target.velVec, flight);
  const dx = finalPt.x - muzzle.x;
  const dz = finalPt.z - muzzle.z;
  const dy = finalPt.y - muzzle.y;
  const horiz = Math.hypot(dx, dz);

  return {
    yaw: Math.atan2(dx, dz),
    pitch: Math.atan2(dy, horiz),
    distance: horiz,
    flightTime: flight
  };
}

function findAimAssist(t, curWorldYaw, curPitch) {
  if (!cheats.assist) return null;
  if (cheats.assistStr <= 0.001) return null;

  let best = null;
  let bestScore = -Infinity;

  for (const e of world.vehicles) {
    if (!e.alive || e.team === t.team || e === t) continue;

    const dist = t.pos.distanceTo(e.pos);
    if (dist > ASSIST_RANGE) continue;

    const from = t.pos.clone(); from.y += 2.0;
    const to   = e.pos.clone(); to.y   += 1.0;
    if (!hasSimpleLOS(from, to)) continue;

    const sol = computeAimSolution(t, e);
    if (!sol) continue;

    const dYaw = Math.abs(normAngle(sol.yaw - curWorldYaw));
    const dPitch = Math.abs(sol.pitch - curPitch);

    if (dYaw > ASSIST_YAW_CONE || dPitch > ASSIST_PITCH_CONE) continue;

    const score =
      -(dYaw / ASSIST_YAW_CONE) * 1.6
      -(dPitch / ASSIST_PITCH_CONE) * 1.0
      -(dist / ASSIST_RANGE) * 0.45;

    if (score > bestScore) {
      bestScore = score;
      best = { target: e, solution: sol, dYaw, dPitch, dist };
    }
  }

  return best;
}

/* ============================================================
   21. 准星世界坐标射线
   ============================================================ */
const _cxOrigin = new THREE.Vector3();
const _cxDir = new THREE.Vector3();
const _cxRay = new THREE.Raycaster();
const _cxPt = new THREE.Vector3();

function computeCrosshairPoint(maxDist = 3000) {
  camera.getWorldPosition(_cxOrigin);
  camera.getWorldDirection(_cxDir);

  _cxRay.set(_cxOrigin, _cxDir);
  _cxRay.near = 0;
  _cxRay.far = maxDist;

  let best = maxDist;
  const hits = _cxRay.intersectObjects(world.hitMeshes, false);
  if (hits.length) best = hits[0].distance;

  // 地形步进采样
  let t = 0;
  let step = 2;
  while (t < best) {
    t += step;
    if (t > 80) step = 8;
    if (t > 400) step = 26;
    if (t > 1200) step = 60;
    _cxPt.copy(_cxOrigin).addScaledVector(_cxDir, t);
    if (_cxPt.y <= terrainHeight(_cxPt.x, _cxPt.z)) {
      if (t < best) best = t;
      break;
    }
  }

  return _cxOrigin.clone().addScaledVector(_cxDir, best);
}

let playerAimPoint = new THREE.Vector3(0, 0, 100);

function createTank(bpId, team, x, z, yaw, isPlayer = false) {
  const t = new Tank(bpId, team, isPlayer);
  const y = terrainHeight(x, z);
  t.pos.set(x, y, z);
  t.yaw = yaw; t.visualYaw = yaw;
  t.desiredTurretWorldYaw = yaw;
  t.root.position.copy(t.pos);
  t.root.rotation.y = yaw;
  world.vehicles.push(t);

  if (Audio2.ready) {
    t.engineVoice = Audio2.createEngineVoice(bpId === 'tiger' || bpId === 'is2' ? 46 : 58);
  }
  return t;
}

function createAircraft(bpId, team, x, y, z, yaw, isPlayer = false) {
  const a = new Aircraft(bpId, team, isPlayer);
  a.pos.set(x, y, z);
  a.yaw = yaw;
  a.desiredYaw = yaw;
  a.pitch = 0;
  a.desiredPitch = 0;
  a.speed = a.bp.minSpeed * 1.15;
  a.throttle = 0.75;
  a.root.position.copy(a.pos);
  world.vehicles.push(a);

  if (Audio2.ready) {
    a.engineVoice = Audio2.createEngineVoice(a.bp.engineFreq || 80);
  }
  return a;
}

function startBattle(vehicleId) {
  gameOver = false;
  assistLocked = false;
  aimReady = false;

  for (const v of world.vehicles) {
    scene.remove(v.root);
    if (v.engineVoice) { v.engineVoice.stop(); v.engineVoice = null; }
    if (v.hitMeshes) {
      for (const m of v.hitMeshes) {
        const i = world.hitMeshes.indexOf(m);
        if (i >= 0) world.hitMeshes.splice(i, 1);
      }
    }
  }
  world.vehicles.length = 0;
  for (const p of world.projectiles) scene.remove(p.mesh);
  world.projectiles.length = 0;
  for (const b of world.bombs) scene.remove(b.mesh);
  world.bombs.length = 0;
  aiControllers.length = 0;

  world.hitMeshes = world.hitMeshes.filter(m => !m.userData.tank);

  const vDef = ALL_VEHICLES[vehicleId];

  if (vDef.kind === 'air') {
    const gy = terrainHeight(0, -400);
    playerVehicle = createAircraft(vehicleId, 0, 0, gy + 220, -400, 0, true);
    aimYaw = 0; aimPitch = 0;
  } else {
    playerVehicle = createTank(vehicleId, 0, 0, -400, 0, true);
    playerVehicle.ammo = {};
    for (const s of playerVehicle.bp.shells) playerVehicle.ammo[s] = 40;
    playerVehicle.currentShell = playerVehicle.bp.shells[0];
    aimYaw = 0;
    aimPitch = 0;
  }

  const allyPool = Object.keys(TANK_BLUEPRINTS).filter(k => k !== vehicleId);
  const allyIds = [
    allyPool[Math.floor(Math.random()*allyPool.length)],
    allyPool[Math.floor(Math.random()*allyPool.length)]
  ];
  const allyPos = [[-75, -435], [80, -430]];
  allyIds.forEach((id, i) => {
    const t = createTank(id, 0, allyPos[i][0], allyPos[i][1], 0);
    aiControllers.push({ ctrl: new AIController(t, 1.0) });
  });

  const pool = Object.keys(TANK_BLUEPRINTS);
  for (let i = 0; i < 5; i++) {
    const id = pool[Math.floor(Math.random()*pool.length)];
    const x = rand(-260, 260);
    const z = rand(320, 450);
    const t = createTank(id, 1, x, z, Math.PI);
    aiControllers.push({ ctrl: new AIController(t, rand(0.72, 1.3)) });
  }

  setAiming(false);
  updateHUD(true);
  log(vDef.kind === 'air' ? '起飞！用机炮扫射地面目标' : '战斗开始！准星变青说明辅助瞄准已锁定', 'info');
  checkBattleEnd();
}

function checkBattleEnd() {
  if (gameOver) return;

  const a = world.vehicles.filter(v => v.alive && v.team === 0).length;
  const b = world.vehicles.filter(v => v.alive && v.team === 1).length;
  const ae = document.getElementById('ally-count');
  const be = document.getElementById('enemy-count');
  if (ae) ae.textContent = a;
  if (be) be.textContent = b;

  if (b === 0) {
    gameOver = true;
    setTimeout(() => showEnd(true, '敌军装甲部队已被全歼'), 1100);
    return;
  }
  if (a === 0) {
    gameOver = true;
    setTimeout(() => showEnd(false, '我方装甲部队已被摧毁'), 1100);
    return;
  }

  for (const v of world.vehicles) {
    if (!v.alive || v.kind === 'air') continue;

    if (v.team === 1 && v.pos.distanceTo(PLAYER_BASE_POS) < BASE_RADIUS) {
      gameOver = true;
      log('敌军占领了我方基地！', 'bad');
      setTimeout(() => showEnd(false, '敌军占领了我方基地'), 900);
      return;
    }
    if (v.team === 0 && v.pos.distanceTo(ENEMY_BASE_POS) < BASE_RADIUS) {
      gameOver = true;
      log('我方成功占领敌军基地！', 'good');
      setTimeout(() => showEnd(true, '我方成功占领敌军基地'), 900);
      return;
    }
  }
}

function showEnd(win, reason) {
  const ov = document.getElementById('overlay');
  ov.classList.remove('hidden');
  ov.innerHTML = `
    <h1 style="color:${win ? '#a8f080' : '#f08080'}">${win ? '胜  利' : '战  败'}</h1>
    <p style="font-size:16px;">${reason || ''}</p>
    <button id="startBtn">再 战 一 次</button>
  `;
  document.getElementById('startBtn').addEventListener('click', () => location.reload());
}

function log(text, type = 'info') {
  const box = document.getElementById('messages');
  if (!box) return;
  const el = document.createElement('div');
  el.className = 'msg';
  el.textContent = text;
  el.style.color = type === 'good' ? '#a8f080'
                 : type === 'bad'  ? '#ff9090'
                 : type === 'warn' ? '#ffd060'
                 : '#cfe8c0';
  box.appendChild(el);
  setTimeout(() => el.remove(), 3400);
  while (box.children.length > 5) box.removeChild(box.firstChild);
}

renderer.domElement.addEventListener('click', () => {
  if (!pointerLocked) renderer.domElement.requestPointerLock();
});
document.addEventListener('pointerlockchange', () => {
  pointerLocked = document.pointerLockElement === renderer.domElement;
});

document.addEventListener('mousemove', e => {
  if (!pointerLocked) return;

  const v = playerVehicle;
  const isAir = v && v.kind === 'air';

  const mx = clamp(e.movementX, -180, 180);
  const my = clamp(e.movementY, -180, 180);

  const sens = (aiming ? 0.00045 : 0.0019) * (isAir ? 0.85 : 1);

  if (isAir) {
    aimYaw   -= mx * sens;
    aimPitch -= my * sens;
    aimPitch = clamp(aimPitch, -0.55, 0.5);
  } else {
    aimYaw   -= mx * sens;
    aimYaw   = clamp(aimYaw, -YAW_LIMIT, YAW_LIMIT);
    aimPitch -= my * sens;
    aimPitch = clamp(aimPitch, -8*DEG, 22*DEG);
  }
});

document.addEventListener('mousedown', e => {
  const v = playerVehicle;
  const isAir = v && v.kind === 'air';

  if (e.button === 2) {
    if (!pointerLocked) return;
    if (isAir) {
      if (v.alive && v.bombCount > 0) v.dropBomb();
    } else {
      setAiming(!aiming);
    }
    return;
  }

  if (e.button !== 0) return;
  if (!pointerLocked) return;
  if (!v || !v.alive) return;

  if (isAir) v.fireGun();
  else v.fire(playerAimPoint);
});

function setAiming(v) {

  document.getElementById('scope').classList.toggle('hidden', !v);
  document.getElementById('crosshair').style.opacity = v ? '0' : '1';
